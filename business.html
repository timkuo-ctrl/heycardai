<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFEFF0">
<title>Heycard 企業後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 品牌字型 ── 繁中 Taipei Sans TC Beta（VI 指定，OFL-1.1）／西文 Creato Display（授權待確認，暫以 Outfit 替代）
     這三行不能省：少了它們繁中會掉回系統 PingFang，跟 App 的字型對不起來 -->
<link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Light/Taipei-Sans-TC.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Regular/Taipei-Sans-TC.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Bold/Taipei-Sans-TC.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══ Heycard 企業後台 · 可操作模擬 ═══
   單一淺色視覺（跟 App 同一套設計系統），所有底色明寫，不跟宿主主題 */
:root{
 --mang:#5C5CFF;--mangD:#4A4AE0;--mangS:#F0F0FF;
 --ink:#1E1E1E;--ink2:#3A3A3A;--ink3:#565656;
 --bg:#EFEFF0;--card:#FFFFFF;--fill:#F5F5F6;--hair:#EBEBEC;
 --amber:#B98900;--amberS:#FBF3DF;--turq:#00D6B3;
 --ft:'Taipei Sans TC','Taipei Sans TC Beta','PingFang TC','Noto Sans TC',system-ui,sans-serif;--fe:'Creato Display','Outfit','Noto Sans TC',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--ft);color:var(--ink);font-size:14px;line-height:1.6;
 -webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}

/* ── 殼層：側欄 ＋ 主區 ── */
#shell{display:flex;min-height:100vh}
#side{flex:0 0 216px;background:var(--card);border-right:1px solid var(--hair);
 padding:22px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
#brand{padding:0 10px 18px}
#brand b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block}
#brand span{font-size:11px;color:var(--ink3)}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
 font-size:13.5px;font-weight:500;color:var(--ink2);width:100%;text-align:left}
.nv svg{flex:0 0 auto}
.nv.on{background:var(--mangS);color:var(--mangD);font-weight:700}
.nv:hover:not(.on){background:var(--fill)}
.nv .n{margin-left:auto;font-family:var(--fe);font-size:11px;font-weight:700;
 background:var(--mang);color:#fff;border-radius:99px;padding:1px 7px}
#sfoot{margin-top:auto;padding:10px}
#main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1080px}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--ink3);margin-top:3px}

/* ── 元件 ── */
.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px 20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.tile .v{font-family:var(--fe);font-size:26px;font-weight:700;letter-spacing:-.02em;
 font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;color:var(--ink3);margin-top:2px}
.tile .d{font-size:11px;color:var(--turq);margin-top:6px}
.sec{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;
 display:flex;align-items:baseline;gap:10px}
.sec span{font-size:11.5px;font-weight:400;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:700;color:var(--ink3);text-align:left;padding:8px 10px;
 border-bottom:1px solid var(--hair);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th:hover{color:var(--mangD)}
th .ar{font-size:9px;margin-left:3px;color:var(--mang)}
td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:default}
tbody tr:hover td{background:var(--fill)}
.num{font-family:var(--fe)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
 padding:4px 10px;border-radius:99px;background:var(--fill);color:var(--ink2)}
.chip.on{background:var(--mang);color:#fff}
.chip.warn{background:var(--amberS);color:var(--amber)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--mang);color:#fff;
 font-size:13px;font-weight:700;padding:9px 16px;border-radius:10px}
.btn:hover{background:var(--mangD)}
.btn.tt{background:var(--fill);color:var(--ink2)}
.btn.tt:hover{background:#E6E6E6}
.btn.sm{padding:6px 12px;font-size:12px}
.inp{background:var(--fill);border:1px solid transparent;border-radius:10px;
 padding:8px 12px;font-size:13px;outline:none;min-width:200px}
.inp:focus{background:var(--card);border-color:var(--mang)}
.tip{font-size:12px;color:var(--ink3);line-height:1.7}
.fixnote{font-size:10.5px;color:var(--mangD)}

/* ── 圖表：量＝單色調；文字永遠用文字色 ── */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar .bl{flex:0 0 76px;font-size:12px;color:var(--ink2);text-align:right}
.bar .btr{flex:1;height:18px;background:var(--fill);border-radius:0 4px 4px 0;position:relative}
.bar .bf{height:100%;border-radius:0 4px 4px 0;background:var(--mang);min-width:3px;
 transition:width .3s}
.bar .bv{position:absolute;left:calc(100% + 8px);top:0;font-family:var(--fe);font-size:12px;
 color:var(--ink2);line-height:18px}
.cols{display:flex;align-items:flex-end;gap:6px;padding-top:26px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.col i{width:100%;max-width:34px;background:var(--mang);border-radius:4px 4px 0 0;
 display:block;min-height:3px;position:relative}
.col.mut i{background:#C7C7FF}
.col b{font-size:10px;color:var(--ink3);font-weight:400}
.col .tipv{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
 background:var(--ink);color:#fff;font-family:var(--fe);font-size:11px;padding:2px 8px;
 border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;white-space:nowrap}
.col:hover .tipv{opacity:1}
.col:hover i{background:var(--mangD)}

/* 抽屜與彈窗 */
#ovl{position:fixed;inset:0;background:rgba(20,20,26,.4);display:none;z-index:50}
#ovl.show{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--card);
 z-index:60;transform:translateX(105%);transition:transform .22s;padding:24px;overflow-y:auto;
 box-shadow:-8px 0 40px -12px rgba(20,20,28,.25)}
#drawer.show{transform:none}
textarea.csv{width:100%;height:220px;background:var(--fill);border:1px solid var(--hair);
 border-radius:10px;padding:12px;font:11.5px/1.6 ui-monospace,monospace;resize:vertical}

.edge{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px 20px;
 margin-bottom:12px}
.edge b{display:block;font-size:13.5px;margin-bottom:4px}
.edge.no{border-left:3px solid var(--amber)}
.edge.yes{border-left:3px solid var(--turq)}
/* 導覽分組與次要區 */
.ngrp{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink3);padding:16px 12px 4px}
.nv2{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;font-size:12px;color:var(--ink3);width:100%;text-align:left}
.nv2.on,.nv2:hover{background:var(--fill);color:var(--ink2)}
/* 一律有回饋：鍵盤焦點、hover 過場 */
button:focus-visible,a:focus-visible,.inp:focus-visible,select:focus-visible{outline:2px solid var(--mang);outline-offset:2px}
.btn,.chip,.nv,.nv2,tbody tr,a{transition:background .15s,color .15s,border-color .15s,opacity .15s}
.bk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink3);cursor:pointer;margin-bottom:12px}
.bk:hover{color:var(--mangD)}
.evrow:hover{border-color:#D9D9D9;background:#FFFFFF}
/* 回饋：提示條與數字閃動——按了就要有動靜 */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:#1E1E1E;color:#fff;
 font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.18s;z-index:80;
 white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}
@keyframes pulse{0%{background:#E0E0FF}100%{background:transparent}}
.pulse{animation:pulse 1.1s ease-out;border-radius:8px}

/* ── 設定頁模式：一區一卡，標題列在上、動作靠右（Stripe／Vercel 式） ── */
.sect{background:var(--card);border:1px solid var(--hair);border-radius:14px;margin-bottom:14px;overflow:hidden}
.sect>.sh{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--hair);min-height:52px}
.sh b{font-size:14px;letter-spacing:-.01em}
.sh .s{font-size:12px;color:var(--ink3)}
.sh .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.sect>.sb{padding:18px 20px}
.sect>.sb.tbl{padding:2px 10px 6px}
.sect>.sb+.sb{border-top:1px solid var(--hair)}
.kpi{display:flex;align-items:baseline;gap:6px;line-height:1}
.kpi b{font-family:var(--fe);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.meta i{width:1px;height:11px;background:#D9D9D9;display:inline-block}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0}
.lrow+.lrow{border-top:1px solid var(--hair)}
.lrow .ic{width:38px;height:38px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:0 0 auto}
.lrow b{font-size:13.5px;display:block}
.lrow .tip{font-size:12px}
.lrow.mute{opacity:.55}
.btn.ghost{background:#fff;border:1px solid var(--hair);color:var(--ink)}
.btn.ghost:hover{background:var(--fill)}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar4{height:4px;border-radius:99px;background:var(--fill);overflow:hidden;width:180px}
.bar4 i{display:block;height:100%;background:var(--mang)}
.drop{border:1.5px dashed #D9D9D9;border-radius:12px;padding:16px;text-align:center;background:#F5F5F6}
.drop.ok{border-style:solid;border-color:#5CD6C4;background:#E2F9F4}
.prwrap textarea.pr{height:118px}
.spec .chip,.specl .chip{white-space:nowrap;align-self:flex-start}
.dlb{font-size:11.5px;font-weight:700;color:var(--ink3);margin-bottom:6px}
/* ── 前台著陸頁（未登入時整頁顯示；登入後只剩後台） ── */
#land{display:none;max-width:1080px;margin:0 auto;padding:0 24px 60px}
body.out #shell{display:none}
body.out #land{display:block}
body.out{background:var(--bg)}
/* ── 導覽：貼頂 ── */
.lnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:26px;padding:16px 0;margin-bottom:8px;background:rgba(239,239,240,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lnav b{font-family:var(--fe);font-size:20px;font-weight:800;letter-spacing:-.02em}
.lnav b span{font-weight:300}
.lnav b.lg{display:flex;align-items:flex-end;gap:7px}
.lnav b.lg>span:last-child{font-family:var(--fe);font-size:15.5px;font-weight:400;color:var(--ink2);line-height:1;padding-bottom:3px;letter-spacing:.01em}
.lgw{display:inline-block;width:92px;color:var(--ink);line-height:0;vertical-align:middle}
.lnav .lgw{margin-top:-2px;color:var(--mang)}
.lnav a{font-size:13.5px;color:var(--ink2);cursor:pointer;text-decoration:none;transition:color .15s}
.lnav a:hover{color:var(--ink)}
.lnav .sp{flex:1}
.lnav .lgn{font-weight:600;color:var(--ink)}
.lnav .go{background:var(--mang);color:#fff;font-weight:700;padding:9px 18px;border-radius:99px}
.lnav .go:hover{background:var(--mangD);color:#fff}
/* Hero 來源 icon 列（Meta 平台 icon 列式） */
.hicons{display:flex;gap:10px;margin-top:20px}
.hicons span{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
/* 段落內 CTA：每一段都能開始（Meta 式重複 CTA） */
.btn.sb{margin-top:22px;padding:11px 22px;font-size:14px;border-radius:99px}
/* 目標卡片 */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:0 36px;margin-top:28px;border-top:1px solid #D9D9D9}
.gcard{padding:20px 0 22px;border-bottom:1px solid var(--hair);display:flex;flex-direction:column}
.gcard .gi{display:none}
.gcard b{font-size:17px;letter-spacing:-.01em;line-height:1.4}
.gcard .gl{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--mangD);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.gcard .gl:hover{text-decoration:underline}
.gcard .gl svg{flex:0 0 auto}
/* 收名片帶狀面板 */
.srcband{margin-top:28px;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:30px 24px}
.srcband .srcrow{grid-template-columns:repeat(4,auto)}
.dn2{display:flex;justify-content:center;color:#BDBDBD;margin:16px 0}
.mailc{border-radius:6px;background:#fff;border:1px solid #E6E6E6;box-shadow:0 8px 20px -12px rgba(30,30,30,.35);padding:12px 10px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.mailc .inb{height:22px;border:1px solid #E6E6E6;border-radius:6px;font-family:var(--fe);font-size:8.5px;color:var(--ink3);display:flex;align-items:center;padding:0 7px;overflow:hidden;white-space:nowrap}
.mailc .bb{height:22px;border-radius:6px;background:var(--mang);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* 企業認證名片：品牌面板 */
.brandp{margin-top:96px;background:#F5F5F6;border:1px solid var(--hair);border-radius:24px;padding:48px 44px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.brandp h2{font-size:28px;letter-spacing:-.03em;line-height:1.3;font-weight:800}
.brandp .d{font-size:15px;color:var(--ink2);margin-top:12px;line-height:1.75}
.fan{position:relative;height:300px}
/* ── Hero：左主張＋流程圖、右登入 ── */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:start;padding:36px 0 24px}
.hero h1{font-size:44px;line-height:1.18;letter-spacing:-.035em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--mang)}
.hero .lead{font-size:18px;color:var(--ink2);margin-top:16px;line-height:1.6;max-width:520px}
.hero .lead b{color:var(--ink);font-weight:700}
/* 流程圖：三張名片 → 公司人脈庫 */
.flow{display:grid;grid-template-columns:auto 72px minmax(0,1fr);align-items:center;gap:0;margin-top:34px}
.flow .cards{display:grid;gap:10px}
.src{display:grid;grid-template-columns:150px auto;gap:12px;align-items:center}
.src .lb{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.src .lb b{display:block;font-size:13px;color:var(--ink)}
.src .lb i{font-style:normal;font-size:11px;color:var(--ink3)}
/* 紙本名片：白卡＋灰線＋掃描框 */
.paper{width:150px;height:95px;border-radius:6px;background:#FFFFFF;border:1px solid #E6E6E6;box-shadow:0 8px 20px -12px rgba(30,30,30,.35);position:relative;padding:14px 14px;overflow:hidden}
.paper i{display:block;height:5px;border-radius:3px;background:#E6E6E6;margin-bottom:6px}
.paper i.t{width:54%;height:8px;background:#BDBDBD;margin-bottom:9px}
.paper i.s{width:70%}.paper i.m{width:44%}
.paper .lg3{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:5px;background:#EFEFF0}
.paper .scan{position:absolute;inset:0;border:2px solid var(--mang);border-radius:6px;opacity:.9}
.paper .scan:before,.paper .scan:after{content:'';position:absolute;left:8px;right:8px;height:1.5px;background:var(--mang);opacity:.7;animation:scan 2.2s ease-in-out infinite}
.paper .scan:after{display:none}
@keyframes scan{0%,100%{top:14%}50%{top:82%}}
@media(prefers-reduced-motion:reduce){.paper .scan:before{animation:none;top:50%}}
.nfcw{position:absolute;right:12px;top:34px;color:rgba(255,255,255,.8)}
.flow .cards .acard{transition:transform .25s}
.flow svg.ln{width:72px;height:100%;display:block;overflow:visible}
.flow .dn{display:none}
.lib{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px 16px;box-shadow:0 18px 44px -28px rgba(30,30,30,.35)}
.lib .h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:8px}
.lib .h span{margin-left:auto;font-family:var(--fe);font-size:11px;color:var(--turqD,#00806E);background:var(--turqS,#E2F9F4);padding:2px 8px;border-radius:99px;font-weight:700}
.lib .r{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:12.5px}
.lib .r .av{width:26px;height:26px;border-radius:8px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2);flex:0 0 auto}
.lib .r .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .r .who i{font-style:normal;color:var(--ink3);margin-left:6px}
.lib .r .by{font-size:11px;color:var(--mangD);background:var(--mangS);padding:2px 7px;border-radius:99px;white-space:nowrap}
.lib .r.new{animation:rowin .6s ease-out both}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ── 痛點：三張小卡 ── */
.pain{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.pain>div{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:20px}
.pain .pi{width:38px;height:38px;border-radius:11px;background:var(--fill);color:var(--ink2);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.pain b{font-size:15px;display:block}
.pain .s{font-size:13px;color:var(--ink3);margin-top:4px}
.ctr{text-align:center;max-width:640px;margin-inline:auto}
.ctr .d{margin-inline:auto}
.srcrow{display:grid;grid-template-columns:repeat(3,auto);gap:18px;justify-content:center}
.srcrow .src{grid-template-columns:1fr;gap:8px;justify-items:center}
.srcrow .lb{text-align:center}
.srcrow .lb i{display:block}
/* ── 段落標題 ── */
.sec2{margin-top:96px}
.sec2 .k{font-size:13px;font-weight:600;color:var(--ink3)}
.sec2 h2{font-size:30px;letter-spacing:-.03em;line-height:1.25;margin-top:8px;font-weight:800}
.sec2 .d{font-size:16px;color:var(--ink2);margin-top:10px;line-height:1.7;max-width:560px}
/* ── 後台縮影 ── */

 +'<div class="g" style="background:'+M.sh+'"></div><div class="bm"></div><div class="gr" style="opacity:'+M.gr+';background-image:'+GR+'"></div><div class="ed" style="border-radius:'+z(16)+'px"></div>';

function qrSVG(seed,sz){
 /* 假 QR：定位框＋雜訊格，看得出是 QR 就好 */
 let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
 const N=17,cell=(sz||120)/N;let px='';
 const rng=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const fp=(x<5&&y<5)||(x>=N-5&&y<5)||(x<5&&y>=N-5);
  if(fp)continue;
  if(rng()>0.52)px+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'"/>'}
 const F=(ox,oy)=>'<rect x="'+(ox*cell)+'" y="'+(oy*cell)+'" width="'+(5*cell)+'" height="'+(5*cell)+'" fill="none" stroke="#1E1E1E" stroke-width="'+cell+'"/>'
  +'<rect x="'+((ox+2)*cell)+'" y="'+((oy+2)*cell)+'" width="'+cell+'" height="'+cell+'"/>';
 return '<svg width="'+(sz||120)+'" height="'+(sz||120)+'" viewBox="0 0 '+(sz||120)+' '+(sz||120)+'" fill="#1E1E1E" style="background:#fff;border-radius:8px;padding:0">'+px+F(0,0)+F(12,0)+F(0,12)+'</svg>'}

   if(bb){bb[e.target.dataset.bf]=e.target.value;save(o)}}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['lem','lpw','lcode'].includes(e.target.id)){const b=$('#lgo');if(b)b.click()}
 if(e.key==='Enter'&&['ncName','ncTax'].includes(e.target.id)){const b=$('#ncGo');if(b)b.click()}});
document.addEventListener('input',e=>{
 const o=ST(),c=o.cart;if(!c)return;
 if(e.target.dataset&&e.target.dataset.ckco){c.co[e.target.dataset.ckco]=e.target.value;save(o);
  if(e.target.dataset.ckco==='name'){const pr=$('#dPr');if(pr)pr.value=nfcPrompt(c)}
  if(e.target.dataset.ckco==='cem'){const g=$('#ckGo');if(g){const bad=e.target.value.indexOf('@')<0;g.disabled=bad;g.style.opacity=bad?'.5':'';e.target.style.borderColor=bad?'#C8322B':''}}return}
 if(e.target.id==='dElem'){c.d.elem=e.target.value;save(o);const pr=$('#dPr');if(pr)pr.value=nfcPrompt(c);return}
 if(e.target.id==='dNotes'){c.d.notes=e.target.value;save(o);return}
 if(e.target.id==='dColor'||e.target.id==='dColorHex'){const v=e.target.value.trim();if(/^#[0-9a-f]{6}$/i.test(v)){c.d.color=v.toUpperCase();save(o);
  const a=$('#dColor'),h=$('#dColorHex'),pr=$('#dPr');if(a&&e.target.id!=='dColor')a.value=v;if(h&&e.target.id!=='dColorHex')h.value=v.toUpperCase();if(pr)pr.value=nfcPrompt(c)}return}});
document.addEventListener('change',e=>{
 if(e.target.id==='ccHue'||e.target.id==='ccInkPick'){ccRefresh();return}
 if(e.target.id==='ncCty'){NC.country=e.target.value;NC.name=($('#ncName')||{}).value||NC.name;drawLand();return}
 if(e.target.id==='dImg'||e.target.id==='dBack'){const f=e.target.files&&e.target.files[0];if(!f)return;const k=e.target.id==='dImg'?'img':'back';
  const rd=new FileReader();rd.onload=()=>{const o=ST();if(!o.cart)return;o.cart.d[k]=f.type==='application/pdf'?'pdf':rd.result;save(o);draw();note((k==='img'?'正面':'背面')+'已附上')};rd.readAsDataURL(f);return}
 if(e.target.id==='indSel'){libInd=e.target.value;draw()}
 if(e.target.dataset&&e.target.dataset.bf)draw()
 if(e.target.id==='evLogoF'||e.target.id==='evBanF'){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const k=e.target.id==='evLogoF'?'logo':'banner';
  const keep={};['evName','evOrg','evDate','evVenue','evIntro'].forEach(id=>{
   const el2=$('#'+id);if(el2)keep[id]=el2.value});
  const rd=new FileReader();
  rd.onload=()=>{const o=ST();o.draft=o.draft||{};o.draft[k]=rd.result;
   Object.keys(keep).forEach(id=>{o.draft['_'+id]=keep[id]});
   save(o);draw()};
  rd.readAsDataURL(f)}});

draw();
</script>

</body></html>
