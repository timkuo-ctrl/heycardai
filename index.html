function contribution(){
 const given=(typeof allMyRecos==='function'?allMyRecos():[])||[];
 const myPosts=S.posts.filter(function(p){return p.mine});
 let got=0,gotPeople=[];
 myPosts.forEach(function(p){
  const rc=(typeof recosFor==='function'?recosFor(p.id):[])||[];
  got+=rc.length;
  rc.forEach(function(x){const c=(typeof candOf==='function')?candOf(x):null;if(c)gotPeople.push(c)})});
 const landed=given.filter(function(x){return x.status==='accepted'}).length;
 const thanks=given.filter(function(x){return x.thanked}).length;
 return {give:given.length,landed:landed,thanks:thanks,
  got:got,gotPeople:gotPeople,posts:myPosts.length}}

function contribHTML(){
 const C=contribution();
 const tot=C.give+C.got;
 if(!tot)return '<div class="sec"><b>互相</b></div>'
  +'<div style="font-size:14px;color:var(--ink3);line-height:1.85">還沒有往返紀錄。'
  +'幫人推薦一次，或發一則需求，這裡就會開始長。</div>'
  +'<div style="display:flex;gap:14px;margin-top:16px">'
  +'<button class="btn sm" data-act="backSeek" style="flex:0 0 auto;padding:0 16px">去看看誰在找人</button></div>';
 const gp=Math.round(C.give/tot*100);
 const say=C.give>C.got*1.5?'你給得比收得多。人情有在累積，需要的時候開口不會空手。'
   :C.got>C.give*1.5?'你收得比給得多。挑一則需求推薦人選，往返才會持續。'
   :'給和收大致打平。這是最穩的狀態，繼續保持。';
 return '<div class="sec"><b>互相</b><span class="ai" style="flex:0 0 auto">AI</span></div>'
 /* 一條雙向長條：左邊是我給的，右邊是我收到的 */
 +'<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">'
 +'<div><div style="font-family:var(--fe);font-size:28px;font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--mang)">'+C.give+'</div>'
 +'<div style="font-size:12.5px;color:var(--ink3);margin-top:5px">我給出的</div></div>'
 +'<div style="text-align:right"><div style="font-family:var(--fe);font-size:28px;font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--turqD)">'+C.got+'</div>'

/* ═══════════════════════════════════════════
   v3.0 ㊳：付費動線——看得見、摸得到、升級了才帶走
   ─────────────────────────────────────────
   原則：
   ① 免費的先好用；付費的「看得見、試得到」，但要升級才能帶走。
      設計器裡的 Plus／Pro 選項全部可以點、預覽會即時套在你自己的名片上——
      這就是期待感的來源：先看到自己名片變好看，再決定要不要。
   ② 分層一眼分得出來：分頁列用細線把「免費｜PLUS｜PRO」分成三段，
      付費分頁掛徽章；款式磁磚右上角也掛徽章。
   ③ 全站唯一的升級入口：upsell() 底部面板——你的名片「現在 → 升級後」
      並排、三行好處、一顆按鈕。paywall() 一律轉進 upsell()。
   ④ 方案頁重做：上方是「你的名片，升級之後」——切 Free／Plus／Pro，
      預覽用的是你自己的名片；下方年繳／月繳、一顆 CTA、精簡的比較表。
   ⑤ 付款在網頁完成（避開 App Store 抽成）：CTA 進 checkout 畫面
      （heycard.app 安全付款頁的樣子），付完回 App 開通。
   ═══════════════════════════════════════════ */

/* ═════ 工具 ═════ */
function planPrice(key,cycle){const P=PLANS[key];return cycle==='y'?Math.round(P.price*10):P.price}
function priceText(key,cycle){return 'NT$'+planPrice(key,cycle).toLocaleString()+(cycle==='y'?'／年':'／月')}
/* 你的名片升級後的樣子（示範值，只用來預覽） */
function upgradedCard(c,tier){
 c=Object.assign({},c||{});
 if(tier==='plus'||tier==='pro'){c.hideBrand=1;if(!+c.hue)c.hue=(c.material==='steel')?128:(c.material==='mist')?182:42}
 if(tier==='pro'){if(!c.ink){const set=(INK_SETS[c.material]||INK_SETS.silver);c.ink=(set[3]||set[1])[1]}if(!c.font||c.font==='modern')c.font='classic'}
 return c}
const TIER_FEATS={
 plus:[['名片上不再有 Heycard 標記','只有你的品牌'],['自由配色','色調由你決定'],['所有款式解鎖','含色調款式']],
 pro: [['洞察全開','人脈的結構、變化、往返'],['AI 搜尋 ×10','每月 200 次'],['名片字色與字體','每種材質一組合得來的顏色'],['年繳送 NFC 實體卡','一碰就交換'],['含 Plus 全部功能','']]};

 sheet('<div style="display:flex;align-items:center;gap:10px">'+tierPill(tier)+'<span style="font-size:12.5px;color:var(--ink3)">'+(tier==='pro'?'讓人脈會思考':'名片是你的')+'</span></div>'

const CJK=/[一-鿿]/;
function nrm(s){return String(s).replace(/\u3000/g,' ').replace(/\s+/g,' ').trim()}
const EN_N={};Object.keys(EN).forEach(function(k){EN_N[nrm(k)]=EN[k]});
function tr(s){
 if(LANG!=='en')return s;
 const k=nrm(s);
 if(EN_N.hasOwnProperty(k))return EN_N[k];
 for(let i=0;i<EN_RX.length;i++){const r=EN_RX[i];const m=k.match(r[0]);if(m){
  if(r[1]===null)return s;
  if(typeof r[1]==='function')return r[1](m);
  /* 群組也翻：$1 裡若還是中文，遞迴查一次 */
  return r[1].replace(/\$(\d)/g,function(_,n){const g=m[+n]||'';return CJK.test(g)?tr(g):g})}}
 return s}

function i18nText(n){
 const t=n.nodeValue;if(!t||!CJK.test(t))return;
 const k=t.trim();if(!k)return;
 const v=tr(k);if(v!==k&&v!==nrm(k))n.nodeValue=t.replace(k,v)}
function i18nEl(el){
 if(el.nodeType===3){i18nText(el);return}
 if(el.nodeType!==1)return;
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode())i18nText(n);

function nfcAll(){return DB.get('nfc',[])}

function nfcBindCard(cardId,cid){
 const list=nfcAll(),i=list.findIndex(function(x){return x.id===cardId});
 const rec={id:cardId,cardId:cid,at:new Date().toISOString().slice(0,10).replace(/-/g,'/'),active:1};
 if(i>=0)list[i]=rec;else list.push(rec);
 DB.set('nfc',list)}

 const authed=!!(S.user&&S.cards.length);

 /* 已開通：別人碰你的卡 → 進公開頁；自己碰自己的卡 → 進管理 */

/* ═══════════════════════════════════════════
   v3.7 ㊼：語言的兩層界線——產品介面 vs 用戶自填
   ─────────────────────────────────────────
   Tim 的原則：
     ① 程式端的產品欄位 → 依瀏覽器語言自動判斷並翻譯
     ② 用戶自填的欄位   → 永遠照用戶自己寫的原文呈現，絕不翻譯

   ① 本來就對；② 有一個真實而且會越來越嚴重的漏洞。

   漏洞：i18n 是「渲染後走訪 DOM，逐個文字節點比對字典」。它不知道哪個
   節點是介面標籤、哪個節點是用戶打的字。只要用戶填的內容剛好命中字典的
   key，就會被改掉。實測（瀏覽器語言 en-US）：
       職稱「設計」   → 顯示成 "Design"
       一句話「洞察全開」→ 顯示成 "Full insights"
   這在名片產品上特別嚴重——被改掉的是別人的職稱與自我介紹。
   而且字典有 500+ 條，越長越容易撞到常見的中文職稱（行銷／業務／設計／財務）。

   修法：給 i18n 一條硬界線。任何在 [translate="no"] 底下的東西，
   走訪器直接跳過整棵子樹（translate 是 HTML 標準屬性，正式版換成
   key-based i18n 之後這條界線一樣成立，不會白做）。
   然後把「渲染用戶資料」的幾個出口一次包起來：
     · cardHTML()  名片本體——所有名片、所有畫面，一個函式全包
     · rowHTML()   人脈列——名字、身分行、活資訊行
     · SCREENS.visit 訪客看到的姓名／職稱／一句話／欄位值
   包在出口，而不是散在每個呼叫點，之後新增畫面也自動受保護。

   ⚠️ 規則：以後任何要把用戶自填內容印出來的地方，用 U(值) 包起來。
   ═══════════════════════════════════════════ */

/* 用戶自填內容的統一出口：包了就不會被翻譯 */
function U(s){return '<span translate="no">'+esc(s==null?'':s)+'</span>'}

/* ═════ ① i18n 走訪器：遇到 translate="no" 整棵子樹跳過 ═════ */
(function(){
 if(typeof i18nEl!=='function')return;
 const SKIP='[translate="no"]';
 i18nEl=function(el){
  if(el.nodeType===3){
   if(el.parentElement&&el.parentElement.closest(SKIP))return;
   i18nText(el);return}
  if(el.nodeType!==1)return;
  if(el.closest&&el.closest(SKIP))return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{
   acceptNode:function(n){
    return (n.parentElement&&n.parentElement.closest(SKIP))
     ?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  let n;while(n=w.nextNode())i18nText(n);
  [el].concat(Array.prototype.slice.call(el.querySelectorAll('[placeholder],[title],[aria-label]')))
   .forEach(function(e){
    if(e.closest&&e.closest(SKIP))return;
    ['placeholder','title','aria-label'].forEach(function(a){
     const v=e.getAttribute&&e.getAttribute(a);
     if(v&&CJK.test(v)){const t=tr(v);if(t!==v)e.setAttribute(a,t)}})})}
})();

/* ═════ ①b 值比對的保底：容器標記漏掉的地方，用「這串字是不是用戶打的」擋下來 ═════
   一句話介紹、可提供這類欄位散在十幾個畫面渲染（_screens12/20/25…），
   逐一標容器是打地鼠，而且以後每加一個畫面就會再漏一次。
   所以再加一層：把用戶自填的自由文字收成一個集合，
   任何「整個文字節點剛好等於其中一條」的節點一律不翻。

   代價講清楚：如果用戶的職稱剛好就叫「設計」，那顆介面上的「設計」按鈕
   在英文模式下也會維持中文。這個取捨是刻意的——
   把別人的職稱和自我介紹翻掉，比一顆按鈕沒翻成英文嚴重得多。
   （注意：產業／層級／職能那些是我們給的固定選項，不在這個集合裡，照常翻。） */
const UF=['name','nameEn','title','company','dept','headline','offer','want',
          'note','addr','web','email','tel','tel2','line','ig','linkedin','venue'];
let USTR=new Set(),USTR_n=0;
function userStrings(){
 const cs=S.cards||[],ct=S.contacts||[];
 const n=cs.length+ct.length;
 if(n===USTR_n&&USTR.size)return USTR;
 const set=new Set();
 const eat=function(o){if(!o)return;UF.forEach(function(k){
  const v=o[k];if(v&&typeof v==='string'&&CJK.test(v))set.add(nrm(v))})};
 cs.forEach(eat);ct.forEach(function(c){eat(c);(c.others||[]).forEach(eat)});
 USTR=set;USTR_n=n;return USTR}
/* 名片一改就讓集合失效 */
(function(){const _sc=Object.getOwnPropertyDescriptor(S,'cards');if(!_sc||!_sc.set)return;
 Object.defineProperty(S,'cards',{get:_sc.get,set:function(v){USTR_n=-1;_sc.set.call(S,v)}})})();

(function(){
 if(typeof i18nText!=='function')return;
 const _txt=i18nText;
 i18nText=function(n){
  const t=n.nodeValue;
  if(t&&CJK.test(t)&&userStrings().has(nrm(t)))return;   /* 用戶打的字，原文照舊 */
  return _txt(n)}
})();

/* ═════ ⑤ 語言偵測：日文／韓文瀏覽器的落點要說得清楚 ═════

(function(){
 if(typeof SCREENS!=='object'||!SCREENS.camMine)return;
 const _cam=SCREENS.camMine;

 const NEXT_WHY={
  front:['正面拍好了','翻到反面再拍一張。台灣名片反面通常是英文版，拍了 AI 會一起帶入。'],
  back :['反面拍好了','兩面都有了，接下來 AI 會把欄位讀出來讓你確認。']};

 function enhance(el){
  const ctl=$('#ctl',el);if(!ctl)return;
  const nx=$('#next',ctl);
  if(!nx||ctl.dataset.done==='1')return;
  const isFront=/反面|back side/i.test(nx.textContent||'');
  const W=NEXT_WHY[isFront?'front':'back'];
  const nxTxt=nx.textContent.trim(), rtTxt=($('#retake',ctl)||{}).textContent||'重拍';

  ctl.dataset.done='1';
  /* 取景框底下的狀態小標跟新的結果帶重複了，拍完就收起來 */
  const fr=$('#frame',el);
  if(fr)$$('*',fr).forEach(function(n){
   const want=[nrm(W[0]),nrm(typeof tr==='function'?tr(W[0]):W[0])];
   if(n.children.length===0&&want.indexOf(nrm(n.textContent||''))>=0)n.style.display='none'});
  ctl.innerHTML=
   '<div style="padding:0 24px">'
   +'<div style="display:flex;align-items:center;gap:8px;justify-content:center">'
   +'<span style="width:20px;height:20px;border-radius:99px;background:var(--turq);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto">'
   +ico('ck',12,'#fff',3.2)+'</span>'
   +'<span style="font-size:15px;font-weight:700;color:#fff">'+esc(W[0])+'</span></div>'
   +'<div style="font-size:12.5px;color:rgba(255,255,255,.62);line-height:1.7;text-align:center;margin-top:8px">'+esc(W[1])+'</div>'
   +'<button class="btn" id="next" style="width:100%;margin-top:18px;gap:8px">'+esc(nxTxt)+ico('arr',16,'#fff',2.6)+'</button>'
   +'<button id="retake" style="width:100%;margin-top:10px;padding:10px;font-size:13.5px;color:rgba(255,255,255,.7)">'+esc(rtTxt)+'</button>'
   +'</div>';
  if(typeof i18nAll==='function'&&LANG==='en')i18nAll();
 }

 SCREENS.camMine=(a)=>{
  const el=_cam(a);
  /* draw() 每次改狀態都會重寫 #ctl，所以用 observer 跟著補 */
  setTimeout(function(){
   const ctl=$('#ctl',el);if(!ctl)return;
   const mo=new MutationObserver(function(){
    if(!$('#next',ctl))ctl.dataset.done='';   /* 回到未拍狀態就重置 */
    enhance(el)});
   mo.observe(ctl,{childList:true,subtree:true});
   enhance(el)},60);
  return el}
})();

if(typeof EN_RX!=='undefined'&&Array.isArray(EN_RX)){EN_RX.push(
 [/^(\d{4}\/\d{2}\/\d{2}) 掃進來\s*·\s*信裡會附上邀請連結$/,'Scanned $1 · the email includes an invite link'],
 [/^(\d{4}\/\d{2}\/\d{2}) 掃進來$/,'Scanned $1'],
 [/^(.+) 掃進來\s*·\s*信裡會附上邀請連結$/,'Scanned $1 · the email includes an invite link']
)}

/* 署名是 const MAIL_SIGN 直接渲染的（不經 mailDraft），所以走字典。
   nrm() 會把換行收成空白，EN_N 建索引時一併正規化，所以這條會命中。 */
if(typeof EN==='object'){
 EN['———\n這封信由 Heycard AI 協助整理。\nHeycard — 讓每一次握手都有價值。\nheycard.com']
  ='———\nDrafted with Heycard AI.\nHeycard — make every handshake count.\nheycard.com';
 if(typeof EN_N==='object')Object.keys(EN).forEach(function(k){EN_N[nrm(k)]=EN[k]})}

/* ═════ ③ AI 草稿：產品固定文案跟著介面語言 ═════
   信件內文是要送出去的東西，渲染後翻一半比不翻更糟，
   所以這裡只換掉 Heycard 的固定署名；內文正式版要由 LLM 以介面語言直接起草。 */
(function(){
 if(typeof mailDraft!=='function')return;
 const ZH='———\n這封信由 Heycard AI 協助整理。\nHeycard — 讓每一次握手都有價值。\nheycard.com';
 const EN_S='———\nDrafted with Heycard AI.\nHeycard — make every handshake count.\nheycard.com';
 const _md=mailDraft;
 const swap=function(v){return (typeof v==='string')?v.split(ZH).join(EN_S):v};
 mailDraft=function(kind,c){
  const r=_md(kind,c);
  if(LANG!=='en')return r;
  if(typeof r==='string')return swap(r);
  if(r&&typeof r==='object'){
   const o=Array.isArray(r)?r.slice():Object.assign({},r);
   Object.keys(o).forEach(function(k){o[k]=swap(o[k])});
   return o}
  return r}
})();
/* ═══════════════════════════════════════════
   v4.0 ㊿：名片的多語言版本（主語言自填 ＋ 其他語言 AI 起草）
   ─────────────────────────────────────────
   Tim 定的邏輯：
     ① 主要頁面由本人自己填（母語）
     ② 第二／三／四種語言由 AI 協助翻譯，先存草稿，確認後才發布
     ③ 主推正反面兩種語言；要開第三、第四種也可以

        美英則英文一種就夠——所以「第二語言」是選項不是義務

   台灣的紙本名片本來就是雙面雙語，我們 v3.0 做的「拍正面／拍反面」

   實體物件本來的形狀。

   · 姓名一律不機器翻譯——英文版預設帶「英文名」欄位（nameEn），沒填就留白請他填
   · 公司名優先用登記的英文名（正式版接商業司），不是翻譯出來的
   · 職稱給候選，不自動選定
   名片上翻錯一個職稱，比沒有英文版更傷。所以一律走「草稿→逐欄確認→發布」。

   資料：
     card.i18n      = {en:{title,company,dept,headline,offer,addr}, ja:{...}}
     card.i18nState = {en:'draft'|'live'}
   翻譯只涵蓋「文字欄位」；電話／Email／網站各語言共用，不重複輸入。

/* 可翻譯的欄位（姓名另外處理，聯絡方式不翻） */
const L10N_F=[['title','職稱'],['company','公司'],['dept','部門'],
              ['headline','一句話介紹'],['offer','可以提供'],['addr','地址']];
const CARD_LANGS=[
 {k:'en',n:'English',zh:'英文'},
 {k:'ja',n:'日本語',zh:'日文'},
 {k:'ko',n:'한국어',zh:'韓文'},
 {k:'zh',n:'中文（繁體）',zh:'中文'}];

function baseLang(c){return (c&&c.lang)||'zh'}
function langName(k){const f=CARD_LANGS.find(function(x){return x.k===k});return f?f.n:k}
function i18nOf(c){return (c&&c.i18n)||{}}
function i18nState(c,k){return ((c&&c.i18nState)||{})[k]||'none'}

/* 某語言的名片：拿主卡疊上該語言的欄位。沒發布就退回主語言。 */
function cardFor(c,k){
 if(!c)return c;
 if(!k||k===baseLang(c))return c;
 if(i18nState(c,k)!=='live')return c;
 const t=i18nOf(c)[k]||{};
 const o=Object.assign({},c);
 L10N_F.forEach(function(f){if(t[f[0]])o[f[0]]=t[f[0]]});
 /* 姓名：非母語版用英文名，沒有就維持原名——絕不音譯 */
 if(k!=='zh'&&c.nameEn)o.name=c.nameEn;
 return o}
function liveLangs(c){
 return Object.keys(i18nOf(c)).filter(function(k){return i18nState(c,k)==='live'})}

function aiTranslateField(key,val,lang){
 if(!val)return '';

/* ═══════════════════════════════════════════
   v4.4 ㊹：分享到 LINE —— 卡片式輪播（Flex Message）
   ─────────────────────────────────────────
   台灣的名片其實不是在會場交換的，是在會後貼進 LINE 的。
   所以 LINE 是這個產品最重要的擴散通道，而不是附加功能。

   結構（Tim 定的）：
     ① 本人名片卡 —— 基本資訊 ＋ 直接可按的行動
     ② 公司卡（有公司情報才出現）
     ③ ★ Heycard 專屬卡 —— 固定放最後一張

   為什麼第三張是關鍵：
   收到卡片的人絕大多數不是 Heycard 用戶。前面兩張讓他拿到聯絡方式，
   第三張才是我們的獲客面。而且它接上既有的迴圈——
   點進去是訪客公開頁（v3.6），存名片留 Email，日後同 Email 註冊時
   人脈已經有人在裡面。所以這張卡不是廣告，是漏斗的入口。

   交付路徑（兩層，正式版都要）：
   · LIFF shareTargetPicker → 真正的 Flex 輪播，但只有 LINE 有，
     且需要 LINE Login channel ＋ LIFF app
   · OG rich link → 任何通訊軟體都吃（Telegram／WhatsApp／Messenger），
     只有單張卡。這是 fallback，也是分享到 LINE 以外時的唯一解
   原型把輪播長相做出來，並產生可直接餵給 LINE API 的 Flex JSON。
   ═══════════════════════════════════════════ */

function flexBubbleUser(c){

 if(c.tel)acts.push({type:'button',style:'primary',height:'sm',
   action:{type:'uri',label:'撥號',uri:'tel:'+c.tel}});
 acts.push({type:'button',style:'secondary',height:'sm',
   action:{type:'uri',label:'看完整名片',uri:'https://heycard.app/c/'+(c.id||'me')}});
 return {type:'bubble',size:'kilo',
  hero:{type:'image',url:'https://heycard.app/og/'+(c.id||'me')+'.png',
        size:'full',aspectRatio:'20:13',aspectMode:'cover'},
  body:{type:'box',layout:'vertical',spacing:'sm',contents:[

    c.headline?{type:'text',text:c.headline,size:'sm',color:'#5A5A63',wrap:true,margin:'md'}:null

function flexBubbleOrg(c){

      uri:'https://heycard.app/join'+(refId?('?ref='+refId):'')}}]}}}

function flexCarousel(c){
 const bubbles=[flexBubbleUser(c),flexBubbleOrg(c),flexBubbleHeycard(c&&c.id)].filter(Boolean);

   contents:{type:'carousel',contents:bubbles}}}

 if(td){const k=td.dataset.today,id=td.dataset.id;
  if(k==='sleep')R.go('draft',{kind:'revive',id:id},'push');
  else if(k==='note')R.go('note',{id:id},'modal');
  else if(k==='hello')R.go('draft',{kind:'hello',id:id},'push');
  else R.go('post',{id:id},'push');
  return}
 const po=t.closest('[data-post]');
 if(po&&!t.closest('[data-rec]')&&!t.closest('[data-fwd]')){R.go('post',{id:po.dataset.post},'push');return}
 const t2=t.closest('[data-t2]');
 if(t2){TAB2=t2.dataset.t2;R.refresh();return}
 if(tab){
  /* 已經站在這一頁就回到頂端（iOS 慣例），而不是什麼都不做 */
  const M0={net:'home',seek:'seek',msg:'msgs',me:'me'};
  const top0=R.top();
  if(TAB===tab.dataset.tab&&top0.name===M0[tab.dataset.tab]&&R.stack.length===1){
   const bd=$('.body',top0.el);if(bd)bd.scrollTo({top:0,behavior:'smooth'});return}
  switchTab(tab.dataset.tab);return}
 if(sw&&sw.dataset.sw!==undefined){S.cur=+sw.dataset.sw;const s=$('.sheet');if(s)s.remove();R.refresh();toast('已切換身分');return}
 if(th){const x=S.threads.find(y=>y.id===th.dataset.th);R.go('thread',{id:x.with},'push');return}
 if(msg){R.go('thread',{id:msg.dataset.msg},'push');return}
 if(c&&c.dataset.c){R.go('contact',{id:c.dataset.c},'push');return}
 if(ask){R.go('search',{q:ask.dataset.ask},'push');return}
 if(rec){R.go('recommend',{id:rec.dataset.rec},'push');return}
 if(fwd){toast('已轉發給你的一度人脈');return}
 if(fl){const k=fl.dataset.flag,v=!fl.classList.contains('on');fl.classList.toggle('on',v);S.flag(k,v);return}
 if(sc){const k=sc.dataset.sec,s=S.sec;s[k]=!s[k];S.sec=s;sc.classList.toggle('on',s[k]);return}
 if(go){R.go(go.dataset.go,{},'push');return}
 if(!A)return;
 const a=A.dataset.act;
 switch(a){
  case 'back': R.back(); break;
  case 'signup': R.go('suEmail',{},'push'); break;
  case 'login': R.go('login',{},'push'); break;
  case 'manual': R.go('cardEdit',{canBack:1},'push'); break;
  case 'scanMine': toast('原型：改用手動輸入示範'); R.go('cardEdit',{canBack:1},'push'); break;
  case 'enter': R.reset('home'); TAB='net'; break;
  case 'camera': R.go('camera',{},'modal'); break;
  case 'doConfirm': {
    const top=R.top(); const shots=top.arg.shots;
    const need=shots.filter(s=>s.low&&s.low.length);
    if(!need.length){shots.forEach(s=>addContact({name:s.name,nameEn:s.nameEn,title:s.title,company:s.company,tel:s.tel,email:s.email,industry:s.industry,level:s.level,func:s.func,via:'photo'}));
      R.reset('home');toast('已收錄 '+shots.length+' 張名片')}
    else R.replace('confirmOne',{shots:need,i:0});
    break}
  case 'skipOne': {
    const top=R.top(); const {shots,i}=top.arg;
    if(i+1<shots.length)R.replace('confirmOne',{shots,i:i+1}); else {R.reset('home');toast('已完成')} break}
  case 'note': { const top=R.top(); const nid=top.arg&&top.arg.id; const sh0=$('.sheet'); if(sh0)sh0.remove();
    if(nid&&S.contact(nid))R.go('note',{id:nid},'modal'); break}
  case 'noteFirst': { const c0=S.contacts[0]; if(c0)R.go('note',{id:c0.id},'modal'); break}
  case 'cMore': {
    const top=R.top();
    sheet('<button class="btn tt" data-act="note" style="margin-bottom:8px">'+ico('edit',16)+'編輯備註</button>'
     +'<button class="btn tt" data-act="saveVcf" style="margin-bottom:8px">'+ico('dl',16)+'存到手機通訊錄</button>'
     +'<button class="btn dg" data-act="del">'+ico('trash',16)+'刪除這位人脈</button>'); break}
  case 'del': {
    const top=R.top(); const id=top.arg.id;
    const s=$('.sheet'); if(s)s.remove();
    S.contacts=S.contacts.filter(x=>x.id!==id); R.back(); R.refresh(); toast('已刪除'); break}
  case 'focusSearch': R.go('search',{},'push'); break;
  case 'closeTip': S.flag('tipSeen',true); R.refresh(); break;
  case 'skipTask': S.flag('skipCollect',true); R.refresh(); toast('沒問題，任務二在「我的名片」裡'); break;
  case 'preview': R.go('pubview',{},'push'); break;
  case 'editCard': { const cur=S.curCard(); R.go('cardEdit',{id:cur.id,canBack:1},'push'); break}
  case 'newCard': { const s=$('.sheet'); if(s)s.remove(); R.go('cardEdit',{canBack:1,extra:1},'push'); break}
  case 'switch': openSwitch(); break;
  case 'shareAll': R.go('share',{all:1},'push'); break;
  case 'settings': R.go('settings',{},'push'); break;
  case 'moreData': R.go('moreData',{},'push'); break;
  case 'aiDesign': R.go('aiDesign',{},'push'); break;
  case 'saveVcf': { const top=R.top(); const c=top.arg&&top.arg.id?S.contact(top.arg.id):S.curCard(); const sh=$('.sheet'); if(sh)sh.remove(); saveVCard(c); break}
  case 'intro': R.go('introCard',{},'push'); break;
  case 'introYes': R.back(); toast('已交換名片，對方會收到你的'); break;
  case 'scanPeer': R.go('scanPeer',{},'modal'); break;
  case 'exchange': { const c=doExchange(); R.go('exchanged',{id:c&&c.id},'push'); break}
  case 'sortToggle': { const o=['met','name','company']; SORT=o[(o.indexOf(SORT)+1)%o.length]; R.refresh(); toast('依'+SORT_N[SORT]+'排序'); break}
  case 'noteNew': { const b=A.dataset.nid; if(b)R.go('note',{id:b},'modal'); break}
  case 'notif': R.go('notif',{},'push'); break;
  case 'compose': R.go('compose',{},'push'); break;
  case 'newMsg': R.go('newMsg',{},'push'); break;
  case 'backSeek': R.reset('seek'); TAB='seek'; break;
  case 'qr': R.go('qr',{mode:'one'},'modal'); break;
  case 'export': exportCSV(); break;
  case 'reset': {
    sheet('<div style="font-size:17px;font-weight:700;letter-spacing:-.02em">重置所有資料</div>'
     +'<div style="font-size:14px;color:var(--ink2);line-height:1.8;margin-top:10px">名片、人脈、備註都會清掉，回到剛安裝的狀態。這個動作沒辦法復原。</div>'
     +'<button class="btn dg" data-act="resetGo" style="margin-top:20px">清除並重新開始</button>'
     +'<button class="tx" data-act="sheetClose" style="display:block;margin:16px auto 0">取消</button>');
    break}
  case 'resetGo': DB.clear(); location.reload(); break;
  case 'logout': {
    const sh=sheet('<div style="font-size:17px;font-weight:700;letter-spacing:-.02em">登出</div>'
     +'<div style="font-size:14px;color:var(--ink2);line-height:1.8;margin-top:10px">資料會留在這個裝置上，下次登入就回來了。</div>'
     +'<button class="btn dg" data-act="logoutGo" style="margin-top:20px">登出</button>'
     +'<button class="tx" data-act="sheetClose" style="display:block;margin:16px auto 0">取消</button>');
    break}
  case 'logoutGo': { const s0=$('.sheet'); if(s0)s0.remove(); R.reset('welcome'); break}
  case 'sheetClose': { const s1=$('.sheet'); if(s1)s1.remove(); break}
  case 'resend': toast('驗證碼已重新寄出'); break;
  /* 各走自己的一頁；登入頁已填的 Email 帶過去（見 _screens39.js） */
  case 'otpLogin': { const em0=$('#em',R.top().el);
    R.go('otpMail',{email:em0?em0.value.trim():''},'push'); break}
  case 'forgotPw': { const em1=$('#em',R.top().el);
    R.go('fpMail',{email:em1?em1.value.trim():''},'push'); break}
  case 'laterNote': { const b0=t.closest('.pl'); if(b0)b0.remove(); toast('晚點再提醒你'); break}
  case 'logoutAll': toast('已登出其他所有裝置'); break;
 }
});

function switchTab(t){
 if(t===TAB&&R.stack.length===1)return;
 TAB=t;
 const M={net:'home',seek:'seek',msg:'msgs',me:'me'};
 R.reset(M[t]||'home')}

function exportCSV(){
 const cs=S.contacts;
 const head=['姓名','英文名','職稱','公司','電話','Email','認識時間','場域','備註'];
 const rows=cs.map(c=>[c.name,c.nameEn,c.title,c.company,c.tel,c.email,c.met,c.venue,c.note]
  .map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','));
 const csv='﻿'+head.join(',')+'\n'+rows.join('\n');
 const b=new Blob([csv],{type:'text/csv;charset=utf-8'});
 const u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download='heycard-contacts.csv';a.click();
 setTimeout(()=>URL.revokeObjectURL(u),1000);
 toast('已匯出 '+cs.length+' 筆')}

/* ═════════ 表單邏輯 ═════════ */
document.addEventListener('input',e=>{
 const top=R.top();if(!top)return;
 const el=top.el;
 if(top.name==='suEmail'){
  const v=$('#em',el)?$('#em',el).value.trim():'';
  const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  const ag=$('#agree',el).classList.contains('on');
  $('#go',el).disabled=!(ok&&ag)}
 if(top.name==='suOtp'){
  const pw=$('#pw',el);if(!pw)return;
  const v=pw.value,st=(v.length>=8?1:0)+(/[a-zA-Z]/.test(v)?1:0)+(/[0-9]/.test(v)?1:0);
  $$('#bars > div',el).forEach((b,i)=>b.style.background=i<st?(st<3?'#B98900':'#00D6B3'):'#E8E8EC');
  $('#go',el).disabled=st<3}
});
document.addEventListener('click',e=>{
 const top=R.top();if(!top)return;const el=top.el;
 if(e.target.closest('#agree')){const s=$('#agree',el);s.classList.toggle('on');
  const v=$('#em',el).value.trim();
  $('#go',el).disabled=!(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)&&s.classList.contains('on'));return}
 if(top.name==='suEmail'&&e.target.closest('#go')){
  const em=$('#em',el).value.trim();
  R.go('suOtp',{email:em},'push');return}
 if(top.name==='suOtp'){
  if(e.target.closest('#peek')){const p=$('#pw',el);p.type=p.type==='password'?'text':'password';return}
  if(e.target.closest('#go')){
   const em=top.arg.email;
   S.user={email:em,slug:(em.split('@')[0]||'me').toLowerCase().replace(/[^a-z0-9]/g,'')};
   S.flag('signedUp',true);
   R.reset('cardMode');return}}
 if(top.name==='login'&&e.target.closest('#go')){
  const em=$('#em',el).value.trim(),pw=$('#pw',el).value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)||pw.length<8){
   const er=$('#e1',el);er.textContent='Email 或密碼不正確';er.classList.remove('hide');return}
  if(!S.user)S.user={email:em,slug:(em.split('@')[0]||'me').toLowerCase().replace(/[^a-z0-9]/g,'')};
  if(!S.cards.length)R.reset('cardMode'); else {R.reset('home');TAB='net'}
  return}
});
/* OTP 輸入自動跳格 */
document.addEventListener('input',e=>{
 if(!e.target.classList.contains('otp'))return;
 const el=R.top().el, boxes=$$('.otp',el);
 e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);
 const i=+e.target.dataset.i;
 e.target.style.background=e.target.value?'#fff':'#F7F7F9';
 e.target.style.borderColor=e.target.value?'#5C5CFF':'#E4E4E9';
 if(e.target.value&&i<5)boxes[i+1].focus();
 /* 只有註冊頁才有密碼區；驗證碼登入頁沒有，要防 */
 if(boxes.every(b=>b.value)){const w=$('#pwWrap',el);if(w){w.classList.remove('hide');setTimeout(()=>{const p=$('#pw',el);if(p)p.focus()},120)}}
});
document.addEventListener('keydown',e=>{
 if(!e.target.classList.contains('otp')||e.key!=='Backspace'||e.target.value)return;
 const el=R.top().el,boxes=$$('.otp',el),i=+e.target.dataset.i;
 if(i>0){boxes[i-1].value='';boxes[i-1].focus();boxes[i-1].style.background='#F7F7F9';boxes[i-1].style.borderColor='#E4E4E9'}
});

/* ═════════ 啟動 ═════════ */
(function boot(){
 if(S.user&&S.cards.length){TAB='net';R.go('home')}
 else if(S.user)R.go('cardMode');
 else R.go('welcome');
 /* 手勢：右滑返回 */
 let sx=0,sy=0;
 document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
 document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);
  if(sx<40&&dx>70&&dy<60&&R.stack.length>1)R.back()},{passive:true});
})();
</script></body></html>
