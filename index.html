<style>
:root{
/* ── VI 色彩系統（heycard_VI手冊 · Color palette） ── */
--ink:#1E1E1E;          /* 01 DarkSteel */
--ink2:#3A3A3A;         /* VI 次階深灰 */
--ink3:#565656;         /* VI 次階中灰 */
--metal:#BDBDBD;        /* 02 MetalGray */
--mang:#5C5CFF;         /* 03 ManganesePurple */
--mangL:#7F7EFF;        /* VI 淺錳紫 */
--mangD:#4A4AE0;--mangS:#F0F0FF;
--turq:#00D6B3;         /* 04 TurquoiseGreen */
--turqL:#5CD6C4;        /* VI 淺青 */
--turqS:#E2F9F4;--turqD:#00806E;
--canvas:#FFF;--surface:#FFF;--hair:#EBEBEC;--e6:#EFEFF0;--fill:#F5F5F6;
--amber:#B98900;--amberS:#FBF3DF;--danger:#C8322B;--dangerS:#FBE9E8;
/* ── VI 字型 ── */
--fe:'Creato Display','Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
--ft:'Taipei Sans TC','Taipei Sans TC Beta','PingFang TC','Noto Sans TC',-apple-system,sans-serif;
/* ── 字階（設計系統：t1 24 · t2 15 · t3 14 · t4 12.5 · t5 11 ＋ 展示級與微級） ── */
--d1:34px;--d2:28px;--t0:20px;--t1:24px;--t2:15px;--t3:14px;--t4:12.5px;--t5:11px;--t6:9.5px;--tt:17px;
/* ── 字重（Taipei Sans TC Beta 僅 Light/Regular/Bold 三級） ── */
--wl:300;--wr:400;--wb:700;
--sh1:none;
--shc:0 2px 5px rgba(18,18,24,.10),0 18px 36px -14px rgba(18,18,24,.30);
/* ── 格線：gutter 20（手機）／section 40／block 16／row 8 ── */
--g:20px;--gs:40px;--gb:16px;--gr:8px;
--sat:max(env(safe-area-inset-top,0px),46px);--sab:max(env(safe-area-inset-bottom,0px),16px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ft);background:#E8E8EA;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;width:100%}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#dev{width:100%;height:100%;max-width:430px;max-height:932px;background:var(--canvas);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px) and (min-height:800px){
 #dev{border-radius:44px;box-shadow:0 0 0 10px #1A1A1E,0 0 0 12px #35353B,0 40px 90px -30px rgba(0,0,0,.55)}
 #dev:before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#1A1A1E;border-radius:99px;z-index:900}
 :root{--sat:46px;--sab:20px}}
/* 模擬狀態列（讓每頁頂端呼吸，像真的裝置） */
#sbar{position:absolute;top:0;left:0;right:0;height:var(--sat);z-index:150;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 9px;font-family:var(--fe)}
#sbar .clk{font-size:15px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
#sbar .st{display:flex;align-items:center;gap:7px;color:var(--ink)}
#sbar.dark .clk,#sbar.dark .st{color:#fff}
/* 畫面堆疊 */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas);will-change:transform}
.scr.push{animation:pin .26s cubic-bezier(.2,.8,.2,1) both}
.scr.modal{animation:min .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes pin{from{transform:translateX(100%)}to{transform:none}}
@keyframes min{from{transform:translateY(100%)}to{transform:none}}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:0 var(--g)}
/* 頂部列 */
.tb{flex:0 0 auto;padding-top:var(--sat);background:var(--surface);border-bottom:1px solid var(--hair)}
.tbi{height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 var(--g)}
.tb.t2 .tbi{height:52px}
.tb .lg{width:74px;color:var(--mang);flex:0 0 auto}
.tb .tt{flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .sl{min-width:40px;display:flex;align-items:center;gap:4px;flex:0 0 auto}
.tb .sl.r{justify-content:flex-end}
.ib{width:38px;height:38px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ib:active{background:#F0F0F4}
.tx{font-size:14px;font-weight:700;color:var(--mang);padding:6px 2px}
.tx.mut{color:var(--ink3)}
.tx:disabled{color:#C8C8D0}
/* 底部導覽 */
.nav{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--hair);display:flex;align-items:flex-start;padding:6px 4px calc(6px + var(--sab));z-index:50}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px}
.nv span{font-size:9.5px;font-weight:400;color:#A6A6AE}
.nv.on span{color:var(--mang);font-weight:700}
.nvc{flex:1;display:flex;justify-content:center}
.nvb{width:46px;height:46px;border-radius:14px;background:var(--ink);display:flex;align-items:center;justify-content:center;margin-top:-8px}
.nvb:active{opacity:.72}
/* 元件 */
.card{position:relative;overflow:hidden;flex:0 0 auto}
.card .g,.card .gr,.card .ed{position:absolute;inset:0}
.card .gr{mix-blend-mode:overlay}
.card .ed{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 0 0 1px rgba(0,0,0,.05)}
.hero{font-family:var(--ft);font-weight:300;letter-spacing:-.055em;line-height:.94}
.lat{font-family:var(--fe);font-weight:300;text-transform:uppercase}
.ftx{display:flex;justify-content:space-between;font-family:var(--fe);font-weight:400;text-transform:uppercase}
.mk{display:flex;flex-direction:column;align-items:flex-start;flex:0 0 auto}
.mk i{display:block;border-radius:1px;transform:skewX(-16deg)}
.pf{border-radius:99px;overflow:hidden;flex:0 0 auto;background:#DCDCE4}
.pf img,.pf svg{width:100%;height:100%;object-fit:cover;display:block}
.btn{border-radius:10px;padding:13px 20px;font-size:14px;font-weight:700;background:var(--mang);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:opacity .12s}
.btn:active{opacity:.72}
.btn[disabled]{background:var(--fill);color:#B4B4B8}
.btn.gh{background:var(--surface);color:var(--ink);border:1px solid var(--e6)}
.btn.tt{background:var(--fill);color:var(--ink)}
.btn.dg{background:var(--fill);color:var(--danger)}
.btn.sm{padding:10px 14px;font-size:12.5px;border-radius:9px;width:auto}
.fld{background:var(--fill);border:1px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:.14s}
.fld:focus-within{background:#fff;border-color:var(--mang)}
.fld.bad{border-color:var(--danger);background:#FFFAFA}
.fld label{display:block;font-size:11px;font-weight:400;color:var(--ink3);margin-bottom:2px}
.fld input,.fld textarea{font-size:14px;font-weight:400;padding:1px 0}
.fld textarea{resize:none;line-height:1.65}
.err{font-size:11px;color:var(--danger);margin:-4px 0 9px;padding-left:3px}
.pl{background:var(--surface);border:1px solid var(--e6);border-radius:14px;padding:16px}
.sec{display:flex;align-items:center;gap:12px;margin:40px 0 16px}
.sec b{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:0 0 auto}
.sec:after{content:'';flex:1}
.chip{font-size:12.5px;font-weight:400;padding:6px 11px;border-radius:8px;background:var(--fill);color:var(--ink2);display:inline-block}
.chip.on{background:var(--mang);color:#fff;border-color:var(--mang)}
.bdg{font-size:11px;font-weight:400;padding:0;display:inline-flex;align-items:center;gap:4px}
.b-m{color:var(--mang)}.b-t{color:var(--turqD)}
.b-a{color:#8A6500}.b-d{color:var(--danger)}
.ai{display:inline-flex;align-items:center;color:var(--mang);font-family:var(--fe);font-size:11px;font-weight:700;letter-spacing:.10em}
.tip{font-size:11px;font-weight:300;color:#8B8B93;line-height:1.7}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row:active{background:var(--fill)}
.av{width:50px;height:50px;border-radius:28%;overflow:hidden;flex:0 0 auto;background:#DCDCE4;box-shadow:0 1px 4px rgba(0,0,0,.10)}
.av.sm{width:42px;height:42px}.av.lg{width:66px;height:66px}
.rt{flex:1;min-width:0}
.rt .n{font-size:14px;font-weight:700;letter-spacing:-.01em}
.rt .s{font-size:11px;font-weight:300;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:absolute;inset:0;background:rgba(18,18,24,.44);display:flex;flex-direction:column;justify-content:flex-end;z-index:200;animation:fin .2s both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.sbx{background:#F4F4F6;border-radius:24px 24px 0 0;padding:14px 18px calc(20px + var(--sab));max-height:82%;overflow-y:auto;animation:min .3s cubic-bezier(.2,.8,.2,1) both}
.grab{width:36px;height:4px;border-radius:99px;background:#D0D0D6;margin:0 auto 14px}
.toast{position:absolute;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);background:#22222A;color:#fff;font-size:12.5px;font-weight:400;padding:10px 16px;border-radius:12px;z-index:900;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:tin .24s both;max-width:86%;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.sim{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:#8A6500;background:var(--amberS);border:1px solid #EFE2BE;padding:3px 7px;border-radius:6px}
.empty{text-align:center;padding:40px 20px}
.empty .t{font-size:15px;font-weight:700;margin-top:14px}
.empty .s{font-size:12.5px;font-weight:300;color:var(--ink3);margin-top:7px;line-height:1.75}
.prog{height:6px;border-radius:99px;background:#EDEDF1;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7F7EFF,#5C5CFF);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.tabs{display:flex;gap:24px;padding:0 var(--g)}
.tab{padding:11px 2px;font-size:14px;font-weight:400;color:var(--ink3);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.sw{width:40px;height:23px;border-radius:99px;background:#D8D8DE;position:relative;flex:0 0 auto;transition:.2s}
.sw.on{background:var(--mang)}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:19px}
svg{display:block}
.hide{display:none!important}

const R={stack:[],
 go(name,arg,mode){
  const prev=this.stack[this.stack.length-1];
  if(prev){prev.el.style.pointerEvents='none';prev.el.setAttribute('aria-hidden','true')}
  const el=SCREENS[name](arg||{});
  el.dataset.name=name;
  if(mode)el.classList.add(mode==='modal'?'modal':'push');
  $('#dev').appendChild(el);
  this.stack.push({name,arg,el});
  requestAnimationFrame(()=>el.querySelector('.body')&&(el.querySelector('.body').scrollTop=0));
 },
 back(){if(this.stack.length<2)return;const t=this.stack.pop();t.el.remove();
  const p=this.stack[this.stack.length-1];if(p){p.el.style.pointerEvents='';p.el.removeAttribute('aria-hidden')}},
 reset(name,arg){this.stack.forEach(t=>t.el.remove());this.stack=[];this.go(name,arg)},
 replace(name,arg){const t=this.stack.pop();if(t)t.el.remove();
  const p=this.stack[this.stack.length-1];if(p){p.el.style.pointerEvents='';p.el.removeAttribute('aria-hidden')}
  this.go(name,arg)},
 refresh(){const t=this.stack[this.stack.length-1];if(!t)return;const el=SCREENS[t.name](t.arg||{});el.dataset.name=t.name;t.el.replaceWith(el);t.el=el},
 top(){return this.stack[this.stack.length-1]}
};

const $$=(s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));

/* 選照片：真的讀本機檔案 */
function pickPhoto(cb){
 const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{
   const img=new Image();img.onload=()=>{
    const cv=document.createElement('canvas'),s=Math.min(img.width,img.height),D=320;
    cv.width=cv.height=D;const x=cv.getContext('2d');
    x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,D,D);
    cb(cv.toDataURL('image/jpeg',0.8))};img.src=rd.result};
  rd.readAsDataURL(f)};
 i.click()}

   (g[k]=g[k]||[]).push(c)});

  return order.filter(function(k){return g[k]}).map(function(k){return secHead(k,g[k].length)+g[k].map(rowHTML).join('')}).join('')}

 return Object.keys(g).sort(function(a,b){return g[b].length-g[a].length})
  .map(function(k){return secHead(k,g[k].length)+g[k].map(rowHTML).join('')}).join('')}

SCREENS.camera=()=>{
 const el=screen('<div class="body" style="background:#141418;position:relative;overflow:hidden">'
 +'<div id="stage" style="position:absolute;inset:0;background:linear-gradient(170deg,#33333A,#141418)"></div>'
 +'<video id="vid" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none"></video>'
 +'<div style="position:absolute;top:calc(var(--sat) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;z-index:6">'
 +'<button class="ib" data-act="back" style="background:rgba(255,255,255,.15)">'+ico('x',18,'#fff')+'</button>'
 +'<button class="ib" id="camOn" style="background:rgba(255,255,255,.15);width:auto;padding:0 12px;font-size:11px;font-weight:400;color:#fff;gap:6px">'+ico('cam',15,'#fff')+'開相機</button></div>'
 +'<div id="frame"></div>'
 +'<div style="position:absolute;bottom:calc(104px + var(--sab));left:0;right:0;display:flex;justify-content:center;z-index:6">'
 +'<div style="display:flex;background:rgba(255,255,255,.16);border-radius:99px;padding:3px;backdrop-filter:blur(10px)">'
 +[['card','名片'],['qr','QR Code']].map(m=>'<button data-mode="'+m[0]+'" style="padding:8px 17px;border-radius:99px;font-size:12.5px;font-weight:'+(CAMMODE===m[0]?600:400)+';'
   +(CAMMODE===m[0]?'background:#fff;color:#1B1B1D':'color:rgba(255,255,255,.75)')+'">'+m[1]+'</button>').join('')+'</div></div>'
 +'<div style="position:absolute;bottom:calc(22px + var(--sab));left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:6">'
 +'<div id="tray" style="width:52px;height:38px;position:relative"></div>'
 +'<button id="shut" style="width:66px;height:66px;border-radius:99px;border:3px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center">'
 +'<div style="width:54px;height:54px;border-radius:99px;background:#fff"></div></button>'
 +'<button id="done" class="hide" style="width:52px;text-align:right;font-size:14px;font-weight:700;color:#fff">完成</button></div>'
 +'</div>');
 const shots=[];
 const drawFrame=()=>{
  $('#frame',el).innerHTML=CAMMODE==='card'
   ?'<div style="position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:62%;aspect-ratio:1/1.586;border-radius:12px;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 0 0 4000px rgba(10,10,14,.46);z-index:4"></div>'
    +'<div style="position:absolute;top:44%;left:0;right:0;transform:translateY(-50%);text-align:center;z-index:5"><span style="font-size:11px;color:rgba(255,255,255,.75);background:rgba(10,10,14,.42);padding:5px 11px;border-radius:8px">把名片放進框裡</span></div>'
   :'<div style="position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:62%;aspect-ratio:1;border-radius:20px;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 0 0 4000px rgba(10,10,14,.5);z-index:4"></div>'
    +'<div style="position:absolute;top:calc(42% + 130px);left:0;right:0;text-align:center;z-index:5"><span style="font-size:12.5px;color:rgba(255,255,255,.82)">對準對方的 Heycard QR</span></div>';
  $$('[data-mode]',el).forEach(b=>{const on=b.dataset.mode===CAMMODE;
   b.style.background=on?'#fff':'transparent';b.style.color=on?'#1B1B1D':'rgba(255,255,255,.75)';b.style.fontWeight=on?600:400})};
 const drawTray=()=>{
  $('#tray',el).innerHTML=shots.slice(0,3).map((s,i)=>'<div style="position:absolute;left:'+(i*8)+'px;width:24px;height:38px;border-radius:5px;background:linear-gradient(160deg,#F2F2F4,#C9C9CE);box-shadow:0 1px 3px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.5)"></div>').join('')
   +(shots.length?'<div style="position:absolute;left:32px;top:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--mang);color:#fff;font-family:var(--fe);font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #22222A">'+shots.length+'</div>':'');
  $('#done',el).classList.toggle('hide',!shots.length)};
 drawFrame();drawTray();
 el.addEventListener('click',async e=>{
  const m=e.target.closest('[data-mode]');
  if(m){CAMMODE=m.dataset.mode;drawFrame();return}
  if(e.target.closest('#camOn')){
   try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#vid',el);v.srcObject=st;v.style.display='block';await v.play();
    $('#stage',el).style.display='none';$('#camOn',el).style.display='none';
    el.dataset.stream='1';el._stream=st}
   catch(err){toast('無法開啟相機，改用模擬拍攝')}
   return}
  if(e.target.closest('#shut')){
   if(CAMMODE==='qr'){
    const p=SCAN_POOL[Math.floor(Math.random()*SCAN_POOL.length)];
    addContact(Object.assign({},p,{via:'qr',venue:''}));
    stopCam(el);R.back();R.refresh();toast('已雙向交換名片');return}
   const p=SCAN_POOL[shots.length%SCAN_POOL.length];
   shots.push(JSON.parse(JSON.stringify(p)));drawTray();
   const fl=h('<div style="position:absolute;inset:0;background:#fff;z-index:20"></div>');el.appendChild(fl);
   setTimeout(()=>{fl.style.transition='opacity .22s';fl.style.opacity='0';setTimeout(()=>fl.remove(),240)},40);
   return}
  if(e.target.closest('#done')){stopCam(el);R.replace('confirm',{shots});return}
 });
 return el};
function stopCam(el){try{if(el._stream)el._stream.getTracks().forEach(t=>t.stop())}catch(e){}}
function addContact(p){
 const list=S.contacts;
 list.unshift(Object.assign({id:uid(),material:['silver','mist','steel','aurora'][list.length%4],avatar:list.length%5,
  met:new Date().toISOString().slice(0,10).replace(/-/g,'/'),note:'',hot:Math.random()>.6?1:0,verified:0,others:[]},p));
 S.contacts=list;return list[0]}

/* ── 拍完總覽 ── */
SCREENS.confirm=(a)=>{
 const need=a.shots.filter(s=>s.low&&s.low.length);
 return screen(tbTitle('確認 '+a.shots.length+' 張名片')
 +'<div class="body pad" style="padding-top:12px">'
 +(need.length?'<div style="display:flex;align-items:center;gap:9px;background:var(--amberS);border:1px solid #EFE2BE;border-radius:12px;padding:10px 12px">'
  +ico('warn',16,'#8A6500')+'<span style="font-size:11px;color:#7A5A00;line-height:1.55">有 <b style="font-weight:700">'+need.length+' 張</b>欄位辨識信心較低，其餘已直接收錄</span></div>':'')
 +a.shots.map((s,i)=>'<div class="pl" style="margin-top:9px;display:flex;gap:12px;align-items:center">'
  +'<div style="width:34px;height:54px;flex:0 0 auto">'+cardHTML({name:s.name,material:'silver'},34,{d:0,photo:0,flat:1,big:15})+'</div>'
  +'<div class="rt"><div class="n" style="font-size:12.5px">'+esc(s.name)+'</div>'
  +'<div class="s" style="color:'+(s.low&&s.low.length?'#8A6500':'#95959D')+'">'+esc(s.company+' · '+s.title)+'</div></div>'
  +(s.low&&s.low.length?'<span class="bdg b-a">'+s.low.length+' 欄待確認</span>':'<span class="bdg b-t">'+ico('ck',10,'#00806E',2.8)+'已好</span>')+'</div>').join('')
 +'<div style="margin-top:16px"><button class="btn" data-act="doConfirm">'+(need.length?'開始確認（'+need.length+'）':'全部收錄')+'</button></div>'
 +'<div class="tip" style="text-align:center;margin-top:10px">沒問題的那幾張已自動收錄，不用再看一次</div>'
 +'<div class="sim" style="margin:16px auto 0;display:table">'+ico('warn',11,'#8A6500',2.2)+'原型：OCR 為模擬資料</div>'
 +'</div>',{}) ;
};

/* ── 逐張確認 ── */
SCREENS.confirmOne=(a)=>{
 const s=JSON.parse(JSON.stringify(a.shots[a.i]));
 const F=[['name','姓名'],['company','公司'],['title','職稱'],['tel','電話'],['email','Email']];
 const el=screen(tbTitle('第 '+(a.i+1)+' / '+a.shots.length+' 張','<button class="tx mut" data-act="skipOne">略過</button>')
 +'<div class="body">'
 +'<div id="pv" style="background:linear-gradient(165deg,#FBFBFC,#EAEAEE);padding:16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #E4E4E9"></div>'
 +'<div class="pad" style="padding-top:14px;padding-bottom:100px">'
 +F.map(f=>{const low=(s.low||[]).indexOf(f[0])>=0;
  return '<div class="fld" style="'+(low?'background:#FDF9EE;border-color:#E8D9A8':'')+'"><label style="'+(low?'color:#8A6500':'')+'">'+f[1]
   +(low?'　<b style="font-weight:700">辨識信心低</b>':'')+'</label><input data-k="'+f[0]+'" value="'+esc(s[f[0]]||'')+'"></div>'}).join('')
 +'<div style="display:flex;gap:7px;margin-top:6px"><button class="chip" data-act="venue">＋ 場域</button></div>'
 +'</div></div>'
 +'<div style="flex:0 0 auto;padding:12px 16px calc(14px + var(--sab));background:#fff;border-top:1px solid #EDEDF1;display:flex;gap:8px">'
 +'<button class="btn tt" data-act="skipOne" style="flex:0 0 88px">略過</button>'
 +'<button class="btn" id="next" style="flex:1">'+(a.i+1<a.shots.length?'確認，下一張':'完成')+'</button></div>');
 const draw=()=>{$('#pv',el).innerHTML=cardHTML({name:s.name,nameEn:s.nameEn,title:s.title,company:s.company,tel:s.tel,email:s.email,material:'silver'},82,{})
  +'<div style="flex:1"><div style="font-size:11px;font-weight:400;color:#8B8B93;margin-bottom:6px">即時預覽</div>'
  +'<div style="font-size:11px;font-weight:300;color:#5E5E66;line-height:1.7">改右邊的欄位，左邊會同步變動。琥珀色的是辨識信心低、需要你看一眼的。</div></div>'};
 el.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;s[k]=e.target.value;draw()});
 el.addEventListener('click',e=>{
  if(e.target.closest('[data-act="venue"]')){s.venue='台北國際電腦展';toast('已加上場域：台北國際電腦展');return}
  if(e.target.closest('#next')){
   addContact({name:s.name,nameEn:s.nameEn,title:s.title,company:s.company,tel:s.tel,email:s.email,
    industry:s.industry,level:s.level,func:s.func,venue:s.venue||'',via:'photo'});
   if(a.i+1<a.shots.length)R.replace('confirmOne',{shots:a.shots,i:a.i+1});
   else{R.reset('home');toast('已收錄 '+a.shots.length+' 張名片')}}
 });
 setTimeout(draw,0);return el};

SCREENS.seek=()=>{
 const posts=S.posts;
 return screen(tbBrand('<button class="ib" data-act="compose">'+ico('plus',21)+'</button>')
 +'<div class="body pad" style="padding-top:12px;padding-bottom:20px">'
 +posts.map(p=>{const by=S.contact(p.by)||{name:'官方精選',company:'Heycard',avatar:0};
  return '<div class="pl" style="margin-bottom:10px;border-radius:16px;box-shadow:var(--sh1);border-color:var(--e6)">'
  +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">'
  +'<div class="av sm" style="width:36px;height:36px">'+avatar(by.avatar,by.photo,by.name)+'</div>'
  +'<div style="flex:1"><div style="font-size:12.5px;font-weight:700">'+esc(by.name)+'</div>'
  +'<div class="tip" style="margin-top:2px">'+esc(by.company||'')+'　·　'+esc(p.when)+'</div></div>'
  +'<span class="bdg b-m">一度人脈</span></div>'
  +'<div style="font-size:14px;font-weight:700;letter-spacing:-.015em;line-height:1.55">在找　'+esc(p.role)+'</div>'
  +'<div style="display:flex;gap:5px;margin-top:8px">'+p.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>'
  +'<div style="font-size:12.5px;font-weight:300;color:#5E5E66;line-height:1.75;margin-top:10px">'+esc(p.text)+'</div>'
  +'<div style="display:flex;gap:8px;margin-top:13px">'
  +'<button class="btn sm" data-rec="'+p.id+'" style="flex:1">我可以推薦</button>'
  +'<button class="btn tt sm" data-fwd="'+p.id+'" style="flex:0 0 74px">轉發</button></div>'
  +(p.recs?'<div class="tip" style="margin-top:9px">已有 '+p.recs+' 人推薦</div>':'')+'</div>'}).join('')
 +'</div>'+navBar())};

SCREENS.compose=()=>{
 const el=screen(tbTitle('發布需求','<button class="tx" id="post" disabled>發布</button>')
 +'<div class="body pad" style="padding-top:16px">'
 +'<div class="sec"><b>我在找</b></div>'
 +'<div class="fld"><label>身分／角色　<span style="color:var(--danger)">必填</span></label><input id="role" placeholder="做電商倉儲自動化的技術長"></div>'
 +'<div style="display:flex;gap:8px"><div class="fld" style="flex:1"><label>產業</label><input id="ind" placeholder="電商 · 物流"></div>'
 +'<div class="fld" style="flex:1"><label>地區</label><input id="loc" placeholder="雙北"></div></div>'
 +'<div class="sec"><b>為什麼要找</b></div>'
 +'<div class="fld"><label>自由補充</label><textarea id="why" rows="4" placeholder="講清楚背景，推薦人才知道該推誰"></textarea></div>'
 +'<div class="tip" style="margin-top:10px">結構化欄位讓系統知道推給誰，自由補充讓人知道你是認真的。<b style="font-weight:400;color:#4A4A52">AI 不代寫</b>——這段話是你自己的誠意。</div>'
 +'</div>');
 el.addEventListener('input',()=>{$('#post',el).disabled=!$('#role',el).value.trim()});
 el.addEventListener('click',e=>{if(!e.target.closest('#post'))return;
  const p={id:uid(),by:null,role:$('#role',el).value.trim(),text:$('#why',el).value.trim(),
   tags:[$('#ind',el).value.trim(),$('#loc',el).value.trim()].filter(Boolean),when:'剛剛',recs:0,mine:1};
  const list=S.posts;list.unshift(p);S.posts=list;R.back();R.refresh();toast('已發布，你的一度人脈會看到')});
 return el};

SCREENS.recommend=(a)=>{
 const p=S.posts.find(x=>x.id===a.id),cs=S.contacts;
 let pick=null;
 const el=screen(tbTitle('推薦','<button class="tx" id="send" disabled>送出</button>')
 +'<div class="body pad" style="padding-top:14px">'
 +'<div class="pl" style="background:#F7F7FA;border-color:#EAEAEF"><div class="tip">對方在找</div>'
 +'<div style="font-size:12.5px;font-weight:700;margin-top:4px">'+esc(p.role)+'</div></div>'
 +'<div class="sec"><b>推薦誰</b><span class="ai" style="flex:0 0 auto">AI</span></div>'
 +'<div id="people">'+cs.slice(0,4).map(c=>'<button class="row" data-p="'+c.id+'" style="width:100%;text-align:left">'
  +'<div class="av sm">'+avatar(c.avatar,c.photo,c.name)+'</div>'
  +'<div class="rt"><div class="n" style="font-size:12.5px">'+esc(c.name)+'</div><div class="s">'+esc(c.company+' · '+c.title)+'</div></div>'
  +'<div class="pick" style="width:22px;height:22px;border-radius:99px;border:1.5px solid #D4D4DC;flex:0 0 auto"></div></button>').join('')+'</div>'
 +'<div class="sec"><b>推薦理由</b><span style="font-size:11px;color:var(--danger);flex:0 0 auto">必填</span></div>'
 +'<div class="fld"><textarea id="why" rows="3" placeholder="為什麼是他？這是你的背書"></textarea></div>'
 +'<div class="tip">讓對方知道為什麼是他。</div>'
 +'</div>');
 const upd=()=>{$('#send',el).disabled=!(pick&&$('#why',el).value.trim())};
 el.addEventListener('input',upd);
 el.addEventListener('click',e=>{
  const b=e.target.closest('[data-p]');
  if(b){pick=b.dataset.p;$$('[data-p] .pick',el).forEach(d=>{d.style.background='';d.style.border='1.5px solid #D4D4DC';d.innerHTML=''});
   const d=$('.pick',b);d.style.background='var(--mang)';d.style.border='0';d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';
   d.innerHTML=ico('ck',13,'#fff',3);upd();return}
  if(e.target.closest('#send')){
   const list=S.posts;const i=list.findIndex(x=>x.id===a.id);list[i].recs=(list[i].recs||0)+1;S.posts=list;
   R.replace('recDone',{id:pick})}
 });
 return el};

SCREENS.newMsg=()=>{
 const el=screen(tbTitle('新訊息')
 +'<div style="flex:0 0 auto;padding:0 16px 12px;background:#fff;border-bottom:1px solid #EDEDF1">'
 +'<div class="fld" style="margin:0;display:flex;align-items:center;gap:8px">'
 +'<span style="font-size:12.5px;color:#8B8B93;flex:0 0 auto">傳給：</span><input id="q" placeholder="搜尋人脈"></div></div>'
 +'<div class="body pad" id="res" style="padding-top:8px"></div>');
 const run=()=>{const q=$('#q',el).value.trim().toLowerCase();
  const hit=S.contacts.filter(c=>!q||[c.name,c.company,c.title].join(' ').toLowerCase().indexOf(q)>=0);
  $('#res',el).innerHTML=(q?'<div class="sec"><b>符合的人脈</b></div>':'<div class="sec"><b>你的人脈</b></div>')

function drawFakeQR(cv,seed){
 if(!cv)return;const x=cv.getContext('2d'),N=21,s=cv.width/N;
 let hsh=0;for(let i=0;i<seed.length;i++)hsh=(hsh*31+seed.charCodeAt(i))>>>0;
 const rnd=()=>{hsh=(hsh*1664525+1013904223)>>>0;return hsh/4294967296};
 x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#1B1B1D';
 const eye=(r,c)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){
  const b=(i===0||i===6||j===0||j===6)||(i>1&&i<5&&j>1&&j<5);
  if(b)x.fillRect((c+j)*s,(r+i)*s,s,s)}};
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const inEye=(i<8&&j<8)||(i<8&&j>N-9)||(i>N-9&&j<8);
  if(inEye)continue;
  if(rnd()>.52)x.fillRect(j*s,i*s,s,s)}
 eye(0,0);eye(0,N-7);eye(N-7,0)}

/* ── 智慧集合（2C 的分法：像相簿，不像 CRM） ── */
function collections(){
 const cs=S.contacts,now=new Date();
 const days=c=>{const d=new Date((c.met||'').replace(/\//g,'-'));return isNaN(d)?999:Math.floor((now-d)/86400000)};
 const ven={};cs.forEach(c=>{if(c.venue)ven[c.venue]=(ven[c.venue]||0)+1});
 const topVen=Object.keys(ven).sort((a,b)=>ven[b]-ven[a])[0];
 const co={};cs.forEach(c=>{if(c.company)co[c.company]=(co[c.company]||0)+1});
 const topCo=Object.keys(co).filter(k=>co[k]>1).sort((a,b)=>co[b]-co[a])[0];
 const L=[
  {k:'new',n:'最近認識',i:'plus',f:c=>days(c)<=90,d:'過去三個月'},
  {k:'sleep',n:'該打招呼了',i:'msg',f:c=>days(c)>180,d:'超過半年沒動靜',warn:1},
  {k:'star',n:'我的最愛',i:'up',f:c=>c.fav,d:'你標記的'},
  {k:'hot',n:'值得深聊',i:'seek',f:c=>c.hot,d:'依產業與職級'}];
 if(topVen)L.splice(2,0,{k:'ven:'+topVen,n:topVen,i:'grid',f:c=>c.venue===topVen,d:'同一場認識的'});
 if(topCo)L.push({k:'co:'+topCo,n:topCo,i:'idc',f:c=>c.company===topCo,d:'同一家公司'});
 return L.map(x=>Object.assign(x,{list:cs.filter(x.f)})).filter(x=>x.list.length)}

/* ── 語意比對：你的人脈裡誰可能符合 ── */
function bigrams(s){const o=[];s=String(s||'').replace(/[\s·,，、。的與和個一]/g,'');
 for(let i=0;i<s.length-1;i++)o.push(s.slice(i,i+2));return o}
function postMatches(p){
 const q=bigrams((p.role||'')+(p.tags||[]).join('')+(p.text||''));
 if(!q.length)return [];

 return S.contacts.filter(function(c){return c.id!==p.by}).map(function(c){
   const hay=[c.industry,c.func,c.title,c.company,c.level,c.note].join('');
   let sc=0;q.forEach(function(g){if(hay.indexOf(g)>=0)sc++});
   return {c:c,sc:sc}}).filter(function(x){return x.sc>0})
  .sort(function(a,b){return b.sc-a.sc}).slice(0,3).map(function(x){return x.c})}

function avStack(list,size){
 size=size||24;
 return '<div style="display:flex;align-items:center">'+list.map(function(c,i){

  +avatar(c.avatar,c.photo,c.name)+'</div>'}).join('')+'</div>'}

/* ═════════ 洞察（重做：從圖表變成可行動的判斷） ═════════ */
function daysSince(c){const d=new Date(String(c.met||'').replace(/\//g,'-'));
 return isNaN(d)?999:Math.floor((new Date()-d)/86400000)}

function netHealth(){
 const cs=S.contacts,n=cs.length||1;
 const noted=cs.filter(function(c){return c.note}).length;
 const sleep=cs.filter(function(c){return daysSince(c)>180}).length;
 const fresh=cs.filter(function(c){return daysSince(c)<=90}).length;
 const talked=cs.filter(function(c){return S.threads.some(function(t){return t.with===c.id})}).length;
 const score=Math.round(noted/n*30+talked/n*30+fresh/n*25+(1-sleep/n)*15);
 return {n:cs.length,noted:noted,sleep:sleep,fresh:fresh,talked:talked,score:Math.max(0,Math.min(100,score))}}

  +'<div style="margin-top:20px"><button class="btn sm" data-act="camera" style="margin:0 auto">去拍名片</button></div></div>';
 const by={};cs.forEach(function(c){const k=c.industry||'其他';by[k]=(by[k]||0)+1});
 const ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
 const max=Math.max.apply(null,ks.map(function(k){return by[k]}))||1;
 const lv={};cs.forEach(function(c){const k=c.level||'其他';lv[k]=(lv[k]||0)+1});

function weeklyCalls(cs){
 const out=[];
 const sleep=cs.filter(function(c){return daysSince(c)>180}).sort(function(a,b){return daysSince(b)-daysSince(a)});
 if(sleep[0]){const c=sleep[0];
  out.push({c:c,t:'先跟 '+c.name+' 說一聲',sub:esc([c.company,c.title].filter(Boolean).join(' · ')),
   why:'你們是 '+(c.met||'很久以前')+' 在'+(c.venue||'某個場合')+'認識的，已經 '+daysSince(c)+' 天沒有往來。'
    +(c.note?'上次你記下的是「'+String(c.note).slice(0,20)+'⋯」，這是很好的開場材料。':'你沒有留下備註，AI 會用比較安全的問候起手。')
    +'越晚開口越尷尬，這是唯一會隨時間變差的一件事。',
   acts:['<button class="btn sm" data-draft="revive:'+c.id+'" style="flex:1">AI 幫我開場</button>',
         '<button class="btn tt sm" data-c="'+c.id+'" style="flex:0 0 auto;padding:0 14px">看情報</button>']})}
 const hot=cs.filter(function(c){return c.hot&&!S.threads.some(function(t){return t.with===c.id})});
 if(hot[0]){const c=hot[0];
  out.push({c:c,t:c.name+' 值得優先經營',sub:esc([c.company,c.title].filter(Boolean).join(' · ')),
   why:'他是'+(c.level||'關鍵角色')+'、負責'+(c.func||'核心業務')+'，在你的人脈裡屬於少數。'
    +'你們認識了但從來沒有對話——高潛力人脈最常見的浪費就是停在「加到了」這一步。',
   acts:['<button class="btn sm" data-draft="hello:'+c.id+'" style="flex:1">AI 幫我 say hello</button>',
         '<button class="btn tt sm" data-c="'+c.id+'" style="flex:0 0 auto;padding:0 14px">看情報</button>']})}
 const co={};cs.forEach(function(c){if(c.company)co[c.company]=(co[c.company]||0)+1});
 const topCo=Object.keys(co).filter(function(k){return co[k]>1}).sort(function(a,b){return co[b]-co[a]})[0];
 if(topCo){
  out.push({i:'idc',t:topCo+' 你已經認識 '+co[topCo]+' 個人',sub:'同一家公司的多點接觸',
   why:'在同一家公司有兩個以上的窗口，意味著你不必只靠一個人推事情。'
    +'如果其中一位是決策層、另一位是執行層，這條線的成功率會明顯高於單點。',
   acts:['<button class="btn tt sm" data-col="co:'+esc(topCo)+'" style="flex:1">看這家公司的人</button>']})}
 const noNote=cs.filter(function(c){return !c.note});
 if(noNote.length>=2){
  out.push({i:'edit',t:noNote.length+' 位人脈沒有任何備註',sub:'AI 對他們幾乎沒有判斷依據',
   why:'名片上的欄位只能告訴系統他是誰，不能告訴系統他要什麼。'
    +'你寫的一句話（他在忙什麼、他缺什麼）才是之後 AI 幫你配對的燃料——這也是為什麼有備註的人，推薦準確度差很多。',
   acts:['<button class="btn tt sm" data-act="noteFirst" style="flex:1">挑一位補備註</button>']})}
 return out.slice(0,3)}

 hello:{n:'剛認識，先打招呼',why:'你們剛換過名片但還沒說過話。第一句訊息的目的不是推銷，是讓對方把臉和名字對起來。'},

function draftFor(kind,c,ctx){
 const me=S.curCard()||{name:'我',company:'',title:''};
 const who=(c&&c.name)||'你好';
 const meta=[me.title,me.company].filter(Boolean).join('・');
 const place=c&&c.venue?('在'+c.venue):'上次';
 const noteBit=c&&c.note?String(c.note).replace(/^(聊到|講到|談到|提到)/,'').split(/[。\n]/)[0].slice(0,28):'';
 if(kind==='hello')return [
  {tone:'自然',t:who+'你好，我是'+me.name+'（'+meta+'）。'+place+'很高興認識你，先跟你打聲招呼。'
    +(c&&c.company?'我對'+c.company+'在做的事蠻有興趣的，之後有機會再跟你請教。':'之後有機會再多聊。')},
  {tone:'直接',t:who+'你好，我是'+me.name+'。'+place+'見過面，怕你名片太多忘記我——我這邊主要在做'+(me.title||'的事')
    +'，如果之後有需要，隨時找我。'},
  {tone:'給對方一個開口的理由',t:who+'你好，我是'+me.name+'（'+meta+'）。'+place+'聊得有點趕，'
    +'如果你最近在忙'+((c&&c.func)||'手上的專案')+'那塊，我這邊或許幫得上一點忙，隨時說一聲。'}];
 if(kind==='revive')return [
  {tone:'從當時聊的事切入',t:who+'好久不見！'+(noteBit?'還記得我們'+place+'聊到「'+noteBit+'」，':'')
    +'最近想到這件事，順手問一下後來怎麼樣了？'},
  {tone:'不裝熟',t:who+'你好，我是'+me.name+'。我們'+place+'認識的，隔了一陣子直接冒出來有點突然，'
    +'但我一直記得你在做的事。最近還順利嗎？'},
  {tone:'帶一個具體的由頭',t:who+'好久沒聯絡了。最近我這邊在'+(me.company||'公司')+'做的東西剛好碰到'
    +((c&&c.industry)||'你熟悉的領域')+'，想到你。有空的話想約個線上 20 分鐘聊聊。'}];
 return [
  {tone:'開門見山',t:who+'你好，我是'+me.name+'（'+meta+'）。想直接請教一件事：'+(ctx||'我目前在找的方向')
    +'。看到你在'+((c&&c.company)||'這個領域')+'，想問你會怎麼看？'},
  {tone:'先給再要',t:who+'你好，我是'+me.name+'。我們'+place+'認識。我最近整理了一份'+((c&&c.industry)||'產業')
    +'的觀察，如果對你有用可以給你。另外想順便請教'+(ctx||'一個問題')+'。'},
  {tone:'降低對方負擔',t:who+'你好，我是'+me.name+'。有件事想請教你：'+(ctx||'我目前卡住的地方')
    +'。不用馬上回，你方便的時候給我兩三句方向就很夠了。'}];
}

function aiAnswerHTML(q){
 const cs=S.contacts;
 let mode='general';
 if(/約|聯絡|見面|見個|喝咖啡/.test(q))mode='meet';
 else if(/合作|夥伴|通路|供應|採購/.test(q))mode='deal';
 else if(/引薦|介紹|認識/.test(q))mode='intro';
 let pick=cs.slice();
 if(mode==='meet')pick=cs.filter(function(c){return c.hot||daysSince(c)>180});
 const kw=bigrams(q);
 pick=pick.map(function(c){
   const hay=[c.industry,c.func,c.title,c.company,c.level,c.venue,c.note].join('');
   let sc=0;kw.forEach(function(g){if(hay.indexOf(g)>=0)sc+=2});
   if(c.hot)sc+=1;
   if(c.note)sc+=1;
   return {c:c,sc:sc}}).sort(function(a,b){return b.sc-a.sc});
 const strong=pick.filter(function(x){return x.sc>=2});
 const use=(strong.length?strong:pick).slice(0,3);
 const lead=strong.length
  ?'從你的 '+cs.length+' 位人脈裡，有 '+strong.length+' 位符合你問的條件。我按「關聯強度」排，並附上判斷依據。'
  :'你的人脈裡<b style="font-weight:400;color:#1B1B1D">沒有完全符合的人</b>。我列出最接近的 '+use.length+' 位，並說明差在哪裡——你也可以直接發一則尋求。';

/* ── 篩選晶片事件（data-colf 為本層專用，不與 data-col 衝突） ──

 COL=(COL===v)?null:v;
 R.refresh()});
/* ═══════════════════════════════════════════
   v0.4 覆寫 ⑨：尋求 —— 讓不敢開口的人也願意用
   問題：頁面以「你的貢獻」計分板開場，把參與定義成績效。
        新使用者第一眼是 0 推薦 0 感謝，等於還沒開始就被評分；
        也隱含「要先付出才有資格開口」。
   決定：改成漸進曝光階梯，讓開口可以從零曝光開始——
        ① 私下問（只在自己人脈裡找，沒有人知道）

        ③ 公開發需求（自己決定誰看得到）
        計分板降級為「紀錄」，移到最下面、歸零不顯示，

   ═══════════════════════════════════════════ */

/* ═════════ 發需求：把「誰看得到」交回給使用者 ═════════ */
const AUDIENCE={
 few:{n:'我選的人',d:'只有你挑的幾位看得到'},
 first:{n:'一度人脈',d:'跟你交換過名片的人'}};

SCREENS.compose=()=>{
 let aud='first', picks=[];
 const el=screen(tbTitle('發布需求','<button class="tx" id="post" disabled>發布</button>')
 +'<div class="body pad" style="padding-top:16px">'
 +'<div class="sec" style="margin-top:0"><b>我在找</b></div>'
 +'<div class="fld"><label>身分／角色　<span style="color:var(--danger)">必填</span></label><input id="role" placeholder="做電商倉儲自動化的技術長"></div>'
 +'<div style="display:flex;gap:8px"><div class="fld" style="flex:1"><label>產業</label><input id="ind" placeholder="電商 · 物流"></div>'

 /* 曝光控制：焦慮的來源是「不知道會被誰看到」 */
 +'<div class="sec"><b>誰看得到</b></div>'
 +'<div id="aud">'+Object.keys(AUDIENCE).map(function(k){
   return '<button data-aud="'+k+'" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)">'
   +'<div style="flex:1"><div style="font-size:14px;font-weight:700">'+AUDIENCE[k].n+'</div>'
   +'<div style="font-size:12.5px;color:var(--ink3);margin-top:3px">'+AUDIENCE[k].d+'</div></div>'

 +'<div id="pickWrap" class="hide" style="padding:12px 0 0"></div>'

 +'<div class="sec"><b>為什麼要找</b><span style="font-size:12.5px;color:var(--ink3);flex:0 0 auto;margin-left:4px">可略過</span></div>'
 +'<div class="fld"><textarea id="why" rows="4" placeholder="講清楚背景，推薦人才知道該推誰"></textarea></div>'

 const drawAud=function(){
  $$('[data-aud]',el).forEach(function(b){
   const on=b.dataset.aud===aud, d=$('.pick',b);

   d.style.display=on?'flex':''; d.style.alignItems='center'; d.style.justifyContent='center';
   d.innerHTML=on?ico('ck',13,'#fff',3):''});
  const w=$('#pickWrap',el);
  w.classList.toggle('hide',aud!=='few');
  if(aud==='few')w.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:8px">'
   +S.contacts.map(function(c){const on=picks.indexOf(c.id)>=0;
    return '<button data-pk="'+c.id+'" style="font-size:12.5px;font-weight:'+(on?700:400)+';padding:7px 13px;border-radius:99px;background:'+(on?'var(--ink)':'var(--fill)')+';color:'+(on?'#fff':'var(--ink2)')+'">'+esc(c.name)+'</button>'}).join('')
   +'</div>'};

 const upd=function(){
  const okRole=!!$('#role',el).value.trim();
  const okAud=aud!=='few'||picks.length>0;
  $('#post',el).disabled=!(okRole&&okAud)};

 el.addEventListener('input',upd);
 el.addEventListener('click',function(e){
  const a=e.target.closest('[data-aud]');
  if(a){aud=a.dataset.aud;drawAud();upd();return}
  const pk=e.target.closest('[data-pk]');
  if(pk){const i=picks.indexOf(pk.dataset.pk);
   if(i>=0)picks.splice(i,1);else picks.push(pk.dataset.pk);
   drawAud();upd();return}
  if(e.target.closest('#post')){

/* ═══════════════════════════════════════════
   v0.5 覆寫 ⑩：尋求 = 以「合作」為基準的動態牆
   ─────────────────────────────────────────
   方向修正：這頁以貼文為主，不放引導內容。
   會回來的理由是「有新東西」，不是「有人教我用」。
   「先在自己人脈裡私下找」的階梯沒有刪掉，改放進發文流程。

   四種貼文型態（都是合作訊號）：
     need    我在找       個人求才／求夥伴
     offer   我可以提供   ← 內向者的入口：給予比索取容易開口
     partner 徵求合作     企業找夥伴
     update  公司動態     企業近況

   給不敢發文的人的三個機制：
     ① offer 型態：主導權在自己，不必承認自己缺什麼
     ② 結構化格式：每則長得一樣，沒有人在比文采
     ③ 一鍵「有興趣」：被動參與也算參與，先回應再發文
   另：永遠不公開顯示 0 回應——沒人理的難堪是最強的勸退。
   ═══════════════════════════════════════════ */

const POST_KINDS={
 need:   {n:'在找',     v:'在找',     act:'我可以推薦', by:'person'},
 offer:  {n:'可以提供', v:'可以提供', act:'我需要這個', by:'person'},
 partner:{n:'徵求合作', v:'徵求',     act:'我們可以談', by:'org'},
 update: {n:'公司動態', v:'',         act:'有興趣',     by:'org'}};
function kindOf(p){return POST_KINDS[p.kind]?p.kind:'need'}

/* ── 企業識別：方圓角＋字首，沿用名片材質語言 ── */
function orgAvatar(name,material,size){
 const s=size||38,M=MAT[material]||MAT.mist;
 return '<div style="width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*0.29)+'px;overflow:hidden;flex:0 0 auto;'
 +'background:'+M.bg+';display:flex;align-items:center;justify-content:center;position:relative">'
 +'<div style="position:absolute;inset:0;mix-blend-mode:overlay;opacity:'+M.gr+';background-image:'+GR+'"></div>'
 +'<span style="position:relative;font-weight:300;font-size:'+Math.round(s*0.42)+'px;color:'+M.ink+'">'+esc((name||'?')[0])+'</span></div>'}

/* ── 一鍵「有興趣」：不必組織語言就能參與 ── */
function interests(){return DB.get('ints',[])}
function hasInterest(id){return interests().indexOf(id)>=0}
function toggleInterest(id){
 const l=interests(),i=l.indexOf(id);
 if(i>=0)l.splice(i,1);else l.push(id);
 DB.set('ints',l);return i<0}

/* ── 動態牆種子：有內容才有回訪 ── */

 {id:'o1',kind:'partner',org:'速倉科技',material:'steel',verified:1,by:null,

/* ═════════ 貼文卡：四種型態共用一套結構 ═════════ */
function postCardHTML(p){
 const k=kindOf(p),K=POST_KINDS[k],isOrg=K.by==='org';
 const me=!!p.mine;
 const who=me?{name:'你',sub:'我發的'}
  :isOrg?{name:p.org||'企業',sub:(p.tags&&p.tags[0])||'企業'}
  :(function(){const c=S.contact(p.by);return c?{name:c.name,sub:[c.company,c.title].filter(Boolean).join(' · '),c:c}:{name:'Heycard',sub:'官方精選'}})();
 const hits=(k==='need'&&!me)?postMatches(p):[];
 const cm=comments(p.id);
 const intOn=hasInterest(p.id);

 return '<div data-post="'+esc(p.id)+'" style="padding:20px 0;border-bottom:1px solid var(--hair)">'
 /* 作者 */
 +'<div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">'
 +(isOrg?orgAvatar(p.org,p.material,38)
   :'<div class="av sm" style="width:38px;height:38px">'+avatar(who.c?who.c.avatar:0,who.c&&who.c.photo,who.c&&who.c.name)+'</div>')
 +'<div style="flex:1;min-width:0">'
 +'<div style="display:flex;align-items:center;gap:5px">'
 +'<span style="font-size:14px;font-weight:700;letter-spacing:-.01em">'+esc(who.name)+'</span>'
 +(p.verified?'<span style="color:var(--mang);display:flex">'+ico('ck',13,'currentColor',3)+'</span>':'')
 +'</div>'
 +'<div style="font-size:12.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
 +esc(who.sub)+'　·　'+esc(p.when)+'</div></div>'
 +'<span style="font-size:12.5px;color:var(--ink3);flex:0 0 auto">'+esc(K.n)+'</span></div>'

 /* 主體：結構化，每則長得一樣——沒有人在比文采 */
 +(K.v&&p.role?'<div style="font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.45;margin-bottom:10px">'
   +esc(K.v)+'　'+esc(p.role)+'</div>':'')
 +(p.text?'<div style="font-size:14px;font-weight:400;color:var(--ink2);line-height:1.8">'+esc(p.text)+'</div>':'')
 +((p.tags&&p.tags.length)?'<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">'
   +p.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div>':'')

 /* 你的人脈裡誰可能符合——只在「在找」型態出現 */
 +(hits.length?'<div style="display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;background:var(--fill);border-radius:12px">'
   +avStack(hits,26)
   +'<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700">你的人脈裡有 '+hits.length+' 位可能符合</div>'
   +'<div style="font-size:12.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
   +esc(hits.map(function(c){return c.name}).join('、'))+'</div></div></div>':'')

 /* 行動列：主行動依型態變，一鍵「有興趣」永遠在 */
 +'<div style="display:flex;gap:8px;margin-top:14px">'
 +(me
   ?'<button class="btn tt sm" data-post="'+esc(p.id)+'" style="flex:1">看 '+(p.recs||0)+' 則推薦</button>'
   :(k==='need'
     ?'<button class="btn sm" data-rec="'+esc(p.id)+'" style="flex:1">'+K.act+'</button>'
     :'<button class="btn '+(intOn?'tt ':'')+'sm" data-int="'+esc(p.id)+'" style="flex:1">'+(intOn?'已表達興趣':K.act)+'</button>'))
 +'<button class="btn tt sm" data-post="'+esc(p.id)+'" style="flex:0 0 auto;padding-left:14px;padding-right:14px">'+ico('msg',15)+(cm.length||'')+'</button>'
 +'<button class="btn tt sm" data-fwd="'+esc(p.id)+'" style="flex:0 0 auto;padding-left:14px;padding-right:14px">'+ico('share',15)+'</button></div>'

 /* 回應數：有才顯示；0 絕不公開——沒人理的難堪最勸退 */
 +(me
   ? '<div style="font-size:12.5px;color:var(--ink3);margin-top:12px">'
     +(p.recs?p.recs+' 則推薦　·　':'')+((p.views||12)+' 人看過（只有你看得到）')+'</div>'
   : (p.recs?'<div style="display:flex;align-items:center;gap:8px;margin-top:12px">'
       +avStack(S.contacts.slice(0,Math.min(3,p.recs)),20)
       +'<span style="font-size:12.5px;color:var(--ink3)">'+p.recs+' 人推薦了人選</span></div>':''))
 +'</div>'}

/* ═══════════════════════════════════════════
   v0.5 覆寫 ⑪：名片頁 = 名片組成 ＋ AI 的燃料槽
   ─────────────────────────────────────────
   這頁的兩個職責：
     ① 名片的組成——多重身分，各是你的一個面向
     ② 個人資訊——交換名片後，AI 判讀雙方合作機會的
        最重要來源之一
   引導的核心手法：把因果關係做成可見的。
   與其寫「請填完整」，不如直接預覽「AI 現在能怎麼介紹你」——
   看到它說不出你們能怎麼合作，才會想補。
   遵守鐵則：永遠不空白，永遠不假裝知道（缺什麼就說缺什麼＋下一步）。
   ═══════════════════════════════════════════ */

/* ── AI 的燃料清單：每一項都寫明「補了之後 AI 才做得到什麼」 ── */
const FUEL=[
 {k:'headline',n:'一句話介紹',pay:'別人看得懂你在做什麼',ai:0},
 {k:'offer',   n:'我可以提供',pay:'AI 才說得出你們能怎麼合作',ai:1},
 {k:'want',    n:'我正在找',  pay:'AI 才能拿你的需求去配對',ai:1},
 {k:'tel',     n:'手機',      pay:'對方找得到你',ai:0},
 {k:'email',   n:'Email',     pay:'對方找得到你',ai:0}];
function fuelState(c){return FUEL.map(function(f){return Object.assign({on:!!(c&&c[f.k])},f)})}

/* ── AI 怎麼介紹你：把資料變成可讀的判讀結果 ── */
function aiSelfIntro(c){
 c=c||{};
 const who=[c.title,c.company].filter(Boolean).join('・');
 const has={h:!!c.headline,o:!!c.offer,w:!!c.want};
 if(has.o&&has.w)
  return {ok:2,t:'剛跟你換名片的人，AI 會這樣介紹你：',
   body:'「'+esc(c.name||'你')+'，'+esc(who||'')+'。'
    +(has.h?esc(c.headline)+' ':'')
    +'他可以提供'+esc(c.offer)+'；目前在找'+esc(c.want)+'。'
    +'如果你手上有相關的線，這是可以直接聊的組合。」',
   note:'AI 只用你自己填的內容判讀，不會替你編造。'};
 if(has.o||has.h)
  return {ok:1,t:'目前 AI 能說到這裡：',
   body:'「'+esc(c.name||'你')+'，'+esc(who||'')+'。'
    +(has.h?esc(c.headline):'')+(has.o?'他可以提供'+esc(c.offer)+'。':'')+'」',
   note:has.w?'':'還缺「我正在找」——沒有這一項，AI 說得出你是誰，說不出你們能怎麼合作。',
   miss:has.w?null:'want'};
 return {ok:0,t:'目前 AI 只能說出名片上的欄位：',
  body:'「'+esc(c.name||'你')+(who?'，'+esc(who):'')+'。」',
  note:'它不知道你能幫別人什麼、你在找什麼，所以無法判讀合作機會。',
  miss:'offer'};
}

 if(w>=150){

 const detail=(o.d===0||w<86)?[]:lines;
 const role=[c.dept,c.title].filter(Boolean).join('　');
 /* 公司 Logo：單色蝕刻感，隨材質明暗自動反轉 */

/* ═══════════════════════════════════════════

   ─────────────────────────────────────────
   修正三個問題：
     · Logo 槽位太細，真機上看不見 → 放大成明確可點的區塊
     · 「更多資料」被我上一版拿掉 → 補回，並給它清楚的定位
     · 砍到東少西少 → 補齊，但用設計邏輯組織

     ① 名片正面    換到名片的人都看得到

   ═══════════════════════════════════════════ */

const LAYOUTS={classic:'經典',center:'置中',minimal:'極簡'};
const LOGOPOS={top:'上方',bottom:'公司名旁'};

/* ── 名片：加入 Logo 位置、版式、色調 ── */
function cardHTML(c,w,o){
 o=o||{};const M=MAT[c.material]||MAT.silver;
 const H=Math.round(w*1.586),k=w/320,z=function(v){return Math.round(v*k*100)/100};
 const showPhoto=o.photo!==0 && !!c.photo && w>=110;
 const nm=c.name||'　';
 const lay=LAYOUTS[c.layout]?c.layout:'classic';
 const lpos=LOGOPOS[c.logoPos]?c.logoPos:'top';
 const big=o.big||(nm.length>=5?34:nm.length===4?38:44);
 const dark=(c.material==='steel'||c.material==='mang');
 const hue=+c.hue||0;
 const lines=[];
 if(c.tel)lines.push(['T',c.tel]);
 if(c.email)lines.push(['E',c.email]);
 if(c.web)lines.push(['W',c.web]);              /* 公司網址：列為名片正面必備 */

/* ═══════════════════════════════════════════

   ─────────────────────────────────────────
   公開頁的戰略定位：這是唯一會被大量外部人看到的畫面。
   要取代 Linktree，靠的不是排版更好，是結構不同——

function softBg(m,hue){

 o=o||{};const M=MAT[c.material]||MAT.silver;

 if(_kind==='solo'){c=Object.assign({},c,{company:c.company||(c.headline||'').slice(0,18)});}
 const lay=LAYOUTS[c.layout]?c.layout:(_kind==='solo'?'minimal':'classic');
 const lpos=LOGOPOS[c.logoPos]?c.logoPos:'top';

 const dark=(c.material==='steel'||c.material==='mang');
 const hue=+c.hue||0;
 const lines=[];
 if(c.tel)lines.push(['T',c.tel]);
 if(c.email)lines.push(['E',c.email]);
 if(c.web)lines.push(['W',c.web]);
 if(w>=150&&c.addr)lines.push(['A',c.addr]);
 const detail=(o.d===0||w<86||lay==='minimal')?[]:lines;
 const role=[c.dept,c.title].filter(Boolean).join('　');
 const ctr=lay==='center';

  +'object-position:'+(ctr?'center':'left')+' center;filter:brightness(0)'+(dark?' invert(1)':'')+';opacity:'+(dark?.86:.78)+';display:block">'};
 const topLogo=(c.logo&&lpos==='top'&&w>=86)?logoImg(19):'<span></span>';

 return '<div class="card" style="width:'+w+'px;height:'+H+'px;border-radius:'+z(16)+'px;box-shadow:'+(o.flat?'0 1px 3px rgba(0,0,0,.18)':'var(--shc)')+'">'
 +'<div style="position:absolute;inset:0;background:'+M.bg+(hue?';filter:hue-rotate('+hue+'deg) saturate(1.1)':'')+'"></div>'

 +'<div style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:'+z(10)+'px;min-height:'+z(19)+'px">'
 +topLogo+brand+'</div>'
 +'<div style="flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;width:100%'+(ctr?';align-items:center':'')+'">'
 +(showPhoto?'<div class="pf" style="width:'+z(56)+'px;height:'+z(56)+'px;margin-bottom:'+z(14)+'px">'+avatar(0,c.photo)+'</div>':'')
 +'<div class="hero" style="font-size:'+z(big)+'px;color:'+M.ink+'">'+esc(nm)+'</div>'
 +(c.nameEn?'<div class="lat" style="font-size:'+z(12)+'px;font-weight:400;letter-spacing:.22em;color:'+M.sub+';margin-top:'+z(9)+'px">'+esc(c.nameEn)+'</div>':'')
 +'</div><div style="width:100%">'
 +(role?'<div style="font-weight:400;font-size:'+z(11.5)+'px;color:'+M.sub+';margin-bottom:'+z(2)+'px">'+esc(role)+'</div>':'')
 +((c.logo&&lpos==='bottom'&&w>=86)
   ?'<div style="display:flex;align-items:center;gap:'+z(8)+'px;'+(ctr?'justify-content:center;':'')+'margin-bottom:'+z(3)+'px">'+logoImg(15)
    +(c.company?'<span style="font-weight:400;font-size:'+z(12.5)+'px;color:'+M.ink+';letter-spacing:-.01em">'+esc(c.company)+'</span>':'')+'</div>'
   :(c.company?'<div style="font-weight:400;font-size:'+z(12.5)+'px;color:'+M.ink+';letter-spacing:-.01em">'+esc(c.company)+'</div>':''))
 +(detail.length?'<div style="height:1px;background:'+M.line+';margin:'+z(11)+'px 0 '+z(9)+'px"></div>'
   +'<div style="display:flex;flex-direction:column;gap:'+z(4.5)+'px">'
   +detail.map(function(r){return '<div style="display:flex;gap:'+z(7)+'px;font-weight:300;font-size:'+z(10.5)+'px;color:'+M.sub+';line-height:1.35'+(ctr?';justify-content:center':'')+'">'

 +'</div></div></div>'}

/* ═══════════════════════════════════════════
   v0.9 覆寫 ⑱：AI 的聯絡判斷 —— 從「多久沒聯絡」改成「為什麼是現在」
   ─────────────────────────────────────────
   問題：「很久沒聯絡了」講的是時間，不是理由。
        對每個人都一樣，等於沒有判斷；而且訴諸愧疚，
        愧疚不會讓人開口。

   改法：掃描機會訊號並排序，時間只當修正項，不當標題。
   訊號（由強到弱）：
     ① 他在找人，而你人脈裡有人選    → 你能幫上忙，最好開口
     ② 他要的正是你能提供的          → 直接的生意
     ③ 你在找的，他可能有            → 直接的需求
     ④ 他公司有新動態                → 有由頭，不突兀
     ⑤ 上次留下未結的線索            → 你們談過的事還沒收尾
     ⑥ 高潛力但從沒說過話            → 換到了卻停在那一步
     ⑦ 資訊可能過期                  → 不是愧疚，是你手上的情報在貶值

   守鐵則：沒有訊號就誠實說沒有，不編造急迫感。
          只用你在場的資料——你自己的備註、換到的名片、他公開發的貼文。
   ═══════════════════════════════════════════ */

function _ov(a,b){                     /* 語意重疊度（bigram，之後可換向量檢索） */
 const q=bigrams(a||''),hay=String(b||'');
 if(!q.length)return 0;
 let n=0;q.forEach(function(g){if(hay.indexOf(g)>=0)n++});
 return n/q.length}

function contactReasons(c){
 if(!c)return [];
 const me=S.curCard()||{},posts=S.posts,out=[];
 const d=daysSince(c);
 const hisPost=posts.filter(function(p){return p.by===c.id}).sort(function(a,b){return (b.recs||0)-(a.recs||0)})[0];
 const orgPost=posts.filter(function(p){return p.org&&c.company&&p.org===c.company})[0];

 /* ① 他在找人，而你認得人 */
 if(hisPost&&(hisPost.kind||'need')==='need'){
  const hits=postMatches(hisPost);
  if(hits.length)out.push({w:100,kind:'help',t:'他在找人，你認得',
   why:'他在找「'+hisPost.role+'」，你的人脈裡有 '+hits.length+' 位可能符合——'+hits.map(function(x){return x.name}).join('、')+'。',
   act:['<button class="btn sm" data-rec="'+hisPost.id+'" style="flex:1">幫他引薦</button>']});
  else out.push({w:62,kind:'help',t:'他正在找人',
   why:'他在找「'+hisPost.role+'」。你沒有現成人選，但回一句、或幫他轉出去，都算幫上。',
   act:['<button class="btn tt sm" data-post="'+hisPost.id+'" style="flex:1">看他的需求</button>']});
 }
 /* ② 他要的正是你能提供的 */
 if(me.offer&&hisPost&&_ov(me.offer,(hisPost.role||'')+(hisPost.text||''))>=.18)
  out.push({w:92,kind:'ask',t:'他要的，正好是你在做的',
   why:'你填的「可以提供」是'+me.offer+'，跟他在找的「'+hisPost.role+'」對得上。這是可以直接談的組合。'});
 /* ③ 你在找的，他可能有 */
 if(me.want&&_ov(me.want,[c.industry,c.func,c.title,c.company,c.note].join(''))>=.16)
  out.push({w:86,kind:'ask',t:'你在找的，他這條線可能有',
   why:'你在找'+me.want+'；他是'+[c.industry,c.level,c.func].filter(Boolean).join('、')
    +'，位置對得上。先問一句比自己硬找快。'});
 /* ④ 他公司有新動態 */
 if(orgPost)
  out.push({w:74,kind:'hello',t:c.company+' 剛有動態',
   why:'「'+String(orgPost.text||orgPost.role||'').slice(0,42)+'⋯」——有由頭開口，不會顯得突兀。',
   act:['<button class="btn tt sm" data-post="'+orgPost.id+'" style="flex:1">看那則動態</button>']});
 /* ⑤ 未結的線索 */
 if(c.note&&/(Q[1-4]|之後|再|想找|卡在|RFP|會發|打算|下半年|明年|評估|計畫)/.test(c.note))
  out.push({w:70,kind:'revive',t:'上次那件事還沒收尾',
   why:'你記下的是「'+String(c.note).slice(0,34)+'⋯」。這是你們談過、但還沒有結果的事——追問進度是最自然的開場。'});
 /* ⑥ 高潛力但從沒說過話 */
 if(c.hot&&!S.threads.some(function(t){return t.with===c.id&&t.msgs&&t.msgs.length}))
  out.push({w:56,kind:'hello',t:'換到了，但從沒說過話',
   why:'他是'+(c.level||'關鍵角色')+'、負責'+(c.func||'核心業務')+'。高潛力人脈最常見的浪費，就是停在「加到了」這一步。'});
 /* ⑦ 資訊貶值（時間只當修正項） */
 if(d>180)
  out.push({w:34,kind:'revive',t:'你手上的資訊在過期',
   why:'距上次接觸 '+d+' 天。他的職務或公司可能已經變了——你名片上這份資料，越久越不可靠。'});

 return out.sort(function(a,b){return b.w-a.w})}

/* ═══════════════════════════════════════════

function netIntel(){
 const cs=S.contacts,me=S.curCard()||{},posts=S.posts,ths=S.threads;
 const n=cs.length||1;
 /* 目標與路徑 */
 const goal=me.want||'';
 const paths=goal?cs.map(function(c){return {c:c,s:_ov(goal,[c.industry,c.func,c.title,c.company,c.note].join(''))}})
   .filter(function(x){return x.s>0}).sort(function(a,b){return b.s-a.s}):[];
 /* 漏斗 */
 const talked=cs.filter(function(c){return ths.some(function(t){return t.with===c.id&&t.msgs&&t.msgs.length})}).length;
 const active=cs.filter(function(c){return ths.some(function(t){return t.with===c.id&&t.msgs&&t.msgs.length>=3})}).length;
 /* 層級 */
 const dec=cs.filter(function(c){return c.level==='決策層'||c.level==='高階主管'}).length;
 const exe=cs.filter(function(c){return c.level==='中階主管'||c.level==='基層'}).length;
 /* 產業集中 */
 const ind={};cs.forEach(function(c){const k=c.industry||'其他';ind[k]=(ind[k]||0)+1});
 const topInd=Object.keys(ind).sort(function(a,b){return ind[b]-ind[a]})[0]||'—';
 const conc=Math.round((ind[topInd]||0)/n*100);
 /* 單點風險 */
 const co={};cs.forEach(function(c){if(c.company){co[c.company]=co[c.company]||[];co[c.company].push(c)}});
 const single=Object.keys(co).filter(function(k){return co[k].length===1});
 /* 資料腐化 */
 const stale=cs.filter(function(c){return daysSince(c)>180}).length;
 const noted=cs.filter(function(c){return c.note}).length;
 /* 互惠 */
 const given=(typeof allMyRecos==='function')?allMyRecos().length:0;
 const got=posts.filter(function(p){return p.mine}).reduce(function(a,p){return a+(p.recs||0)},0);
 /* 全網最該做的一件事 */
 let best=null;
 cs.forEach(function(c){const R=contactReasons(c);if(R[0]&&(!best||R[0].w>best.r.w))best={c:c,r:R[0]}});
 return {n:cs.length,goal:goal,paths:paths,talked:talked,active:active,dec:dec,exe:exe,
  topInd:topInd,conc:conc,single:single,stale:stale,noted:noted,given:given,got:got,best:best}}

/* 結構性判斷：不是描述現況，是指出會卡在哪 */
function diagnoses(I){
 const out=[];
 if(I.dec>0&&I.exe===0)out.push({t:'有決策層，沒有執行層',
  d:'案子談成之後沒有人幫你推下去，這是最常見的卡點。',fix:'補一位對方公司的中階窗口'});
 if(I.exe>0&&I.dec===0)out.push({t:'有執行層，沒有決策層',
  d:'事情做得動，但預算與拍板不在你認識的人手上。',fix:'請現有窗口引薦他的主管'});

function pool(){return DB.get('pool',null)||seedPool()}
function seedPool(){

 S.cards.forEach(function(c){
  [['tel',c.tel],['email',c.email],['line',c.line],['ig',c.ig],['web',c.web]].forEach(function(x){
   if(x[1]&&!p[x[0]].some(function(v){return v.v===x[1]}))
    p[x[0]].push({v:x[1],n:cardLabel(c)})})});
 DB.set('pool',p);return p}
function poolAdd(k,v,n){const p=pool();p[k]=p[k]||[];
 if(!p[k].some(function(x){return x.v===v}))p[k].push({v:v,n:n||''});DB.set('pool',p)}

    +P.map(function(x){const on=x.v===val;

     +(on?'<span style="color:var(--mang);display:flex;flex:0 0 auto">'+ico('ck',18,'currentColor',2.6)+'</span>':'')

 el.addEventListener('click',function(e){

/* ═══════════════════════════════════════════
   v1.3 覆寫 ㉒：洞察＝監測系統，不是統計報表
   ─────────────────────────────────────────
   關鍵尺度思考：1000 人的洞察 ≠ 5 人的洞察。
   5 人你都記得，不需要分析。
   1000 人時「科技業佔 60%」是廢話——
   真正的價值是「我幫你盯著這 1000 個人，這週有幾件事值得看」。
   人工追蹤 1000 人不可能，這是 app 唯一做得到而你做不到的事。

   所以順序是：本週變化 → 資產分層 → 覆蓋熱圖 → 樞紐
   維度可切換，全部圖表化，文字降到最低。
   ═══════════════════════════════════════════ */

let INS_DIM='value';
const INS_DIMS={value:'價值',industry:'產業',level:'層級',live:'活躍'};

/* ── 資產分層：1000 人裡真正有價值的可能只有 50 個 ── */
function tierOf(c){
 const d=daysSince(c);
 const talked=S.threads.some(function(t){return t.with===c.id&&t.msgs&&t.msgs.length});
 const deep=S.threads.some(function(t){return t.with===c.id&&t.msgs&&t.msgs.length>=3});
 if(deep||c.fav)return 0;
 if(talked||c.note)return 1;
 if(d<=180)return 2;
 return 3}

/* ── 本週變化：監測系統的核心產出 ── */
function changes(){
 const out=[];
 S.contacts.forEach(function(c){
  const org=S.posts.filter(function(p){return p.org&&p.org===c.company})[0];
  if(org)out.push({k:'org',c:c,t:c.company+' 有新動態',s:String(org.text||org.role||'').slice(0,30),id:org.id});
  const hp=S.posts.filter(function(p){return p.by===c.id})[0];
  if(hp)out.push({k:'post',c:c,t:c.name+' 在找人',s:hp.role||'',id:hp.id});
  if((SEED_NEWS[c.company]||[]).length)
   out.push({k:'news',c:c,t:c.company+' 外部消息',s:SEED_NEWS[c.company][0].t.slice(0,30)});
 });
 const seen={};
 return out.filter(function(x){const k=x.k+(x.c.company||x.c.id);if(seen[k])return false;seen[k]=1;return true})}

/* ── 樞紐：誰能帶你進最多新圈子 ── */
function hubs(){
 const cs=S.contacts,co={};
 cs.forEach(function(c){if(c.company){co[c.company]=(co[c.company]||0)+1}});
 return cs.map(function(c){
  let s=0;
  if(c.level==='決策層')s+=3;else if(c.level==='高階主管')s+=2;else s+=1;
  if(co[c.company]===1)s+=2;                    /* 唯一窗口＝新圈子入口 */
  if(c.venue)s+=1;
  if(S.posts.some(function(p){return p.by===c.id}))s+=2;
  return {c:c,s:s}}).sort(function(a,b){return b.s-a.s}).slice(0,3)}

/* ── 圖表元件 ── */
function stackBar(parts){
 const tot=parts.reduce(function(a,x){return a+x.v},0)||1;
 return '<div style="display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--fill)">'
 +parts.map(function(x){return x.v?'<i style="width:'+(x.v/tot*100)+'%;background:'+x.c+'"></i>':''}).join('')+'</div>'
 +'<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:14px">'
 +parts.map(function(x){return '<div style="display:flex;align-items:center;gap:7px">'
  +'<i style="width:8px;height:8px;border-radius:99px;background:'+x.c+';flex:0 0 auto"></i>'
  +'<span style="font-size:12.5px;color:var(--ink3)">'+esc(x.n)+'</span>'
  +'<span style="font-family:var(--fe);font-size:14px;font-weight:700">'+x.v+'</span></div>'}).join('')+'</div>'}

function heat(rows,cols,get,max){
 return '<div style="overflow:hidden">'
 +'<div style="display:flex;gap:4px;margin-left:64px;margin-bottom:6px">'
 +cols.map(function(c){return '<div style="flex:1;font-size:11px;color:var(--ink3);text-align:center;white-space:nowrap;overflow:hidden">'+esc(c)+'</div>'}).join('')+'</div>'
 +rows.map(function(r){
   return '<div style="display:flex;align-items:center;gap:4px;margin-bottom:4px">'
   +'<div style="width:60px;flex:0 0 auto;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r)+'</div>'
   +cols.map(function(c){const v=get(r,c),p=max?v/max:0;

     +'background:'+(v?'rgba(92,92,255,'+(0.15+p*0.75).toFixed(2)+')':'var(--fill)')+'">'
     +(v?'<span style="font-family:var(--fe);font-size:11px;font-weight:700;color:'+(p>.5?'#fff':'var(--ink)')+'">'+v+'</span>':'')
     +'</div>'}).join('')+'</div>'}).join('')+'</div>'}

/* ── 洞察主體 ── */

 const cell=function(r,c2){return cs.filter(function(x){return (x.industry||'其他')===r&&(x.level||'')===c2}).length};

 return '<div class="pad" style="padding-bottom:28px">'
 /* ① 本週變化——1000 人尺度的唯一剛需 */

   +'<div style="font-size:12.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.s)+'</div></div>'
   +ico('arr',16,'#C4C4CC')+'</button>'}).join('')
  :'<div style="font-size:14px;color:#C4C4CC;padding:4px 0">這週沒有變化</div>')

 /* ② 分析維度切換 */
 +'<div class="sec"><b>你的網路</b></div>'
 +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">'
 +Object.keys(INS_DIMS).map(function(k){const on=INS_DIM===k;

 +'<div class="sec"><b>樞紐</b></div>'

/* ═══════════════════════════════════════════
   v1.6 覆寫 ㉕：結構版本控管 ＋ 導航防護
   ─────────────────────────────────────────
   問題：原型改過三十幾次資料結構，瀏覽器裡的舊 localStorage
        混上新程式，某個畫面就會炸掉——而且症狀是「進不去」，
        因為 R.go 在建畫面時丟出例外，堆疊沒推進去。

   解法兩層：
   ① 結構版本：版本不符時只重置「示範資料」，
      保留使用者真正的東西（帳號、名片、人脈、備註）。
   ② 導航防護：任何畫面建立失敗都不再讓整個 app 卡住，
      改為顯示可回復的錯誤畫面。永遠不要空白。
   ═══════════════════════════════════════════ */

const SCHEMA=21;

(function migrate(){
 let v=0;
 try{v=+DB.get('schema',0)||0}catch(e){v=0}
 if(v===SCHEMA)return;
 /* 示範資料重建；使用者自己的東西不動 */
 ['posts','recos','comments','ints','stats','pool'].forEach(function(k){
  try{DB.set(k,undefined);localStorage.removeItem('hc_'+k)}catch(e){}});
 /* 重跑種子旗標 */
 const f=DB.get('flags',{})||{};
 ['v04seed','v05feed','v14fields','v19assets','v22solo','v24myfeel'].forEach(function(k){delete f[k]});
 DB.set('flags',f);
 /* 示範貼文就地重建。本檔跑在種子之後，光清旗標的話，
    這一輪的動態牆會是空的，要等下次開 app 才補回來。 */
 try{
  const mine=(DB.get('posts',[])||[]).filter(function(p){return p&&p.mine});
  const base=[].concat(typeof SEED_MINE!=='undefined'?SEED_MINE:[],
                       typeof SEED_POSTS!=='undefined'?SEED_POSTS:[],
                       typeof SEED_FEED!=='undefined'?SEED_FEED:[]);
  if(base.length)DB.set('posts',mine.concat(base));
 }catch(e){}
 /* 清掉指向不存在人脈的對話 */
 try{
  const ids={};(DB.get('contacts',[])||[]).forEach(function(c){ids[c.id]=1});
  const th=(DB.get('threads',null)||[]).filter(function(t){return !t.with||ids[t.with]});
  if(th.length)DB.set('threads',th);else localStorage.removeItem('hc_threads');
 }catch(e){}
 DB.set('schema',SCHEMA);
 /* 本檔在 boot() 之前執行，畫面還沒建立，不需要重載 */
})();

/* ═════ 導航防護：畫面建不出來也不能讓 app 卡死 ═════ */
/* ① arg 永遠是物件：全 app 到處寫 R.top().arg.id，
      少傳一次參數就整頁炸掉，從源頭補起來比逐處防禦可靠 */
const _top=R.top.bind(R);
R.top=function(){return _top()||{name:'',arg:{},el:null}};

/* ② 畫面建不出來也不能讓 app 卡死 */
const _go=R.go.bind(R);
R.go=function(name,arg,mode){
 arg=arg||{};
 try{return _go(name,arg,mode)}
 catch(err){
  const el=screen(tbTitle('這一頁出了問題')
   +'<div class="body pad" style="padding-top:24px">'
   +'<div style="font-size:14px;color:var(--ink2);line-height:1.85">這個畫面沒有正常打開。'
   +'多半是裝置上還留著舊版本的資料。</div>'
   +'<div style="font-size:12.5px;color:var(--ink3);margin-top:12px;word-break:break-all">'+esc(String(err&&err.message||err))+'</div>'
   +'<button class="btn" data-act="reset" style="margin-top:24px">重置資料並重新開始</button>'
   +'<button class="tx" data-act="back" style="display:block;margin:18px auto 0">返回</button>'
   +'</div>');
  el.dataset.name='error';
  const prev=this.stack[this.stack.length-1];
  if(prev){prev.el.style.pointerEvents='none';prev.el.setAttribute('aria-hidden','true')}
  $('#dev').appendChild(el);
  this.stack.push({name:'error',arg:{},el:el});
 }};

const IND_ITEM={
 '科技業':'資訊軟體服務、電子零組件批發、電腦設備安裝',
 '製造業':'金屬製品製造、機械設備製造、模具製造',
 '餐飲':'餐館業、飲料店業、食品批發',
 '金融':'投資顧問、創業投資、企業管理顧問',
 '零售':'零售業、電子商務、國際貿易',
 '行銷':'廣告服務、市場研究、企業形象規劃',
 '物流':'倉儲業、汽車貨運、國際物流承攬',
 '醫療':'醫療器材批發、生技研發服務',
 '教育':'教育服務、圖書出版、線上課程'};

function _hash(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}

/* 查不到登記資料時，用名片上掃到的欄位撐起同一個版位。
   推測值一律掛 _soft，介面上標「待驗證」，不冒充公示資料。 */
function orgStub(name,c){
 c=c||{};
 const h=_hash(name),ind=c.industry||'';
 const CAP=['500 萬元','1,000 萬元','2,000 萬元','3,000 萬元','5,000 萬元'];
 const SIZE=['約 10 人','約 25 人','約 50 人','約 90 人','約 150 人'];
 const suf=/(公司|工作室|事務所|商行|企業社)$/.test(name)?'':'股份有限公司';
 return {_soft:1,
  full:name+suf,tax:'',
  addr:c.addr||'',capital:CAP[h%5],rep:'',founded:String(1998+(h%26))+'/'+String(1+(h%12)).padStart(2,'0'),
  ticker:'',ind:ind,size:SIZE[(h>>3)%5],web:c.web||'',
  desc:ind&&IND_ITEM[ind]?('登記營業項目以'+IND_ITEM[ind]+'為主。細部營運概要尚未取得，可由對方補齊。')
   :'尚未取得這家公司的營運概要，可以請對方補齊，或由你自己記一筆。',
  tags:[],hc:0}}

function orgOf(n,c){
 if(!n)return null;
 const O=(typeof ORGS==='object'&&ORGS)?ORGS[n]:null;
 return O||orgStub(n,c)}

/* ═════ 頭像 ═════
   全站不再出現通用人形剪影——那是「沒有內容」的視覺說法。
   沒照片就用姓氏字首，配色由名字決定，同一個人到哪都長一樣。 */
/* 頭像沿用名片的五種材質，同一個人在哪都是同一塊材質 */
const _MG={
 silver:{a:'#FCFCFD',b:'#C9C9CE',ink:'#191A1C'},
 steel :{a:'#3D3D42',b:'#131316',ink:'#F2F2F4'},
 aurora:{a:'#EDEDF8',b:'#6E6EFF',ink:'#1A1A26'},
 mist  :{a:'#F8F8F9',b:'#E2E2E5',ink:'#1E1E20'},
 mang  :{a:'#7B7BFF',b:'#3E3ED8',ink:'#FFFFFF'}};
const _MGK=['silver','steel','aurora','mist','mang'];
let _mgN=0;
function monoSVG(name,material){
 const ch=String(name||'')[0]||'';
 const key=_MG[material]?material:_MGK[Math.abs(_hash(name))%_MGK.length];
 const M=_MG[key],id='mg'+(++_mgN);
 /* SVG 讓字首跟著容器縮放：28px 的小頭像到 66px 的大頭像都一樣穩 */
 return '<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">'
 +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0.55" y2="1">'
 +'<stop offset="0" stop-color="'+M.a+'"/><stop offset="1" stop-color="'+M.b+'"/></linearGradient></defs>'
 +'<rect width="100" height="100" fill="url(#'+id+')"/>'
 +(ch?'<text x="50" y="52" text-anchor="middle" dominant-baseline="central" '
   +'font-size="40" font-weight="300" letter-spacing="-2" fill="'+M.ink+'">'+esc(ch)+'</text>':'')
 +'</svg>'}

function avatar(seed,url,name){
 /* 自己帶尺寸：這個函式被塞進各種尺寸的容器裡，不能靠外部 CSS */
 if(url)return '<img src="'+esc(url)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">';
 return monoSVG(name||'',null)}

/* ═════ 頭像：沒有真人照片時用材質字首磚，不用通用剪影 ═════

 c=c||{};

/* 有對話 = 正在進行；沒對話但 AI 判斷該聯絡 = 建議 */
function msgSuggest(){
 let cs=[];
 try{
  const th=S.threads||[];
  cs=(S.contacts||[]).filter(function(c){
   return c&&c.id&&!th.some(function(t){return t&&t.with===c.id&&t.msgs&&t.msgs.length})});
 }catch(e){return []}
 const out=[];
 cs.forEach(function(c){
  let R=[];try{R=contactReasons(c)||[]}catch(e){R=[]}
  if(R.length)out.push({c:c,r:R[0]})});
 out.sort(function(a,b){return (b.r.w||0)-(a.r.w||0)});
 return out.slice(0,3)}

SCREENS.msgs=()=>{
 let th=[];
 try{th=(S.threads||[]).filter(function(t){
  return t&&t.msgs&&t.msgs.length&&S.contact(t.with)})}catch(e){th=[]}

 return screen(bigHead('訊息',null,'<button class="ib" data-act="newMsg">'+ico('edit',19)+'</button>')
 +'<div class="body pad" style="padding-bottom:24px">'
 +(th.length

 +(sug.length

/* ═══════════════════════════════════════════
   v1.8 覆寫 ㉗：身分型態成為一級概念
   ─────────────────────────────────────────
   問題：整個資料模型預設「人一定屬於某家公司」。
        接案設計師、獨立顧問、個人工作室進來就沒有版位——
        名片會空一行，人脈清單會顯示「—」。

   決定：身分型態有三種，名片、人脈列、詳情頁共用同一個判斷。
     company  受雇於公司　　公司名為主，職稱為輔
     studio   個人工作室　　工作室名為主，職稱為輔（可有登記）
     solo     獨立接案　　　專業定位為主，服務範圍為輔，不留公司欄

   ② Heycard 用戶在人脈裡要看得出來——但不能吵。
      名字後面一枚識別記號，頭像一圈品牌色描邊，
      副標第二行才是差別所在：用戶的資料是活的。

   ③ 拿掉「他加入之後你會多拿到」那塊推銷。
      邏輯不順的地方在於：那段在賣 Heycard，按鈕卻叫「寫封信給他」。
      真正順的邏輯是——你手上的名片正在過期，請他更新；
      更新的機制剛好就是加入。邀請是副產品，不是訴求。

   ④ 修「AI 幫我開場」點了沒反應：
      今天的項目改用 contactReasons 的 kind 之後，
      舊的 data-today 路由只認得 sleep/note/hello，其餘一律當貼文，
      拿聯絡人 id 去找貼文自然找不到。改走既有的 data-draft 管線。
   ═══════════════════════════════════════════ */

/* ═════ ① 身分型態 ═════ */
const STUDIO_RE=/(工作室|工作坊|事務所|設計室|studio|atelier|lab|創意所)/i;
function idKind(c){
 c=c||{};
 if(c.orgKind==='company'||c.orgKind==='studio'||c.orgKind==='solo')return c.orgKind;
 if(!c.company)return 'solo';
 return STUDIO_RE.test(c.company)?'studio':'company'}

const ID_LABEL={company:'',studio:'個人工作室',solo:'獨立接案'};

/* 人脈列、搜尋結果、切換清單共用的第二行 */
function idLine(c){
 c=c||{};
 const k=idKind(c);
 if(k==='solo')return [c.title||c.func||'獨立工作者',c.offer||c.industry].filter(Boolean).join(' · ');
 return [c.company,c.title].filter(Boolean).join(' · ')}

/* ═════ ① 名片：solo 不留空的公司列 ═════ */
function cardHTML(c,w,o){
 o=o||{};const M=(typeof cardTheme==='function')?cardTheme(c):(MAT[c.material]||MAT.silver);
 const H=Math.round(w*1.586),k=w/320,z=function(v){return Math.round(v*k*100)/100};
 const showPhoto=o.photo!==0 && !!c.photo && w>=110;
 const nm=c.name||'　';
 const K=idKind(c);
 /* 獨立接案的人最需要的就是聯絡方式，別預設用極簡版式把它藏掉 */
 const lay=LAYOUTS[c.layout]?c.layout:'classic';
 const lpos=LOGOPOS[c.logoPos]?c.logoPos:'top';
 const big=o.big||(K==='solo'&&w>=150?(nm.length>=5?38:48):(nm.length>=5?34:nm.length===4?38:44));
 const dark=(c.material==='steel'||c.material==='mang');
 const hue=+c.hue||0;
 const lines=[];
 if(c.tel)lines.push(['T',c.tel]);
 if(c.email)lines.push(['E',c.email]);
 if(c.web)lines.push(['W',c.web]);
 if(w>=150&&c.addr)lines.push(['A',c.addr]);
 const detail=(o.d===0||w<86||lay==='minimal')?[]:lines;
 const ctr=lay==='center';

 /* 主列＝這個人的歸屬；副列＝在裡面做什麼。
    solo 沒有歸屬，主列就換成他的專業，副列放服務範圍。 */
 const mainLine=(K==='solo')?(c.title||c.func||c.headline||''):(c.company||'');
 const subLine =(K==='solo')?(c.offer||c.industry||'')
                            :[c.dept,c.title].filter(Boolean).join('　');

 const logoImg=function(h){return '<img src="'+esc(c.logo)+'" alt="" style="height:'+z(h)+'px;max-width:'+z(104)+'px;object-fit:contain;'
  +'object-position:'+(ctr?'center':'left')+' center;filter:brightness(0)'+(dark?' invert(1)':'')+';opacity:'+(dark?.86:.78)+';display:block">'};
 const topLogo=(c.logo&&lpos==='top'&&w>=86)?logoImg(19):'<span></span>';
 const brand=c.hideBrand?'<span></span>':'<div style="width:'+z(50)+'px;color:'+M.mark+';flex:0 0 auto">'+LOGO+'</div>';

 return '<div class="card" style="width:'+w+'px;height:'+H+'px;border-radius:'+z(16)+'px;box-shadow:'+(o.flat?'0 1px 3px rgba(0,0,0,.18)':'var(--shc)')+(M.font?';font-family:'+M.font:'')+'">'
 +'<div style="position:absolute;inset:0;background:'+M.bg+(hue?';filter:hue-rotate('+hue+'deg) saturate(1.1)':'')+'"></div>'
 /* 灰階材質轉色相沒有反應（灰沒有色相可轉），改用「上色」疊層讓色調真的看得見 */
 +((hue&&/^(silver|mist|steel)$/.test(c.material||'silver'))?'<div style="position:absolute;inset:0;background:hsl('+hue+' 72% '+(c.material==='steel'?'46':'62')+'% / '+(c.material==='steel'?'.34':'.28')+');mix-blend-mode:color;pointer-events:none"></div>':'')
 +'<div class="g" style="background:'+M.sh+'"></div><div class="gr" style="opacity:'+M.gr+';background-image:'+GR+'"></div>'
 +'<div class="ed" style="border-radius:'+z(16)+'px"></div>'
 +'<div style="position:relative;height:100%;padding:'+z(24)+'px '+z(23)+'px;display:flex;flex-direction:column'+(ctr?';text-align:center;align-items:center':'')+'">'
 +'<div style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:'+z(10)+'px;min-height:'+z(19)+'px">'
 +topLogo+brand+'</div>'
 +'<div style="flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;width:100%'+(ctr?';align-items:center':'')+'">'
 +(showPhoto?'<div class="pf" style="width:'+z(56)+'px;height:'+z(56)+'px;margin-bottom:'+z(14)+'px">'+avatar(0,c.photo,c.name)+'</div>':'')
 +'<div class="hero" style="font-size:'+z(big)+'px;color:'+M.ink+'">'+esc(nm)+'</div>'
 +(c.nameEn?'<div class="lat" style="font-size:'+z(12)+'px;font-weight:400;letter-spacing:.22em;color:'+M.sub+';margin-top:'+z(9)+'px">'+esc(c.nameEn)+'</div>':'')
 +'</div><div style="width:100%">'
 +(subLine?'<div style="font-weight:400;font-size:'+z(11.5)+'px;color:'+M.sub+';margin-bottom:'+z(2)+'px">'+esc(subLine)+'</div>':'')
 +((c.logo&&lpos==='bottom'&&w>=86)
   ?'<div style="display:flex;align-items:center;gap:'+z(8)+'px;'+(ctr?'justify-content:center;':'')+'margin-bottom:'+z(3)+'px">'+logoImg(15)
    +(mainLine?'<span style="font-weight:400;font-size:'+z(12.5)+'px;color:'+M.ink+';letter-spacing:-.01em">'+esc(mainLine)+'</span>':'')+'</div>'
   :(mainLine?'<div style="font-weight:400;font-size:'+z(12.5)+'px;color:'+M.ink+';letter-spacing:-.01em">'+esc(mainLine)+'</div>':''))
 +(detail.length?'<div style="height:1px;background:'+M.line+';margin:'+z(11)+'px 0 '+z(9)+'px"></div>'
   +'<div style="display:flex;flex-direction:column;gap:'+z(4.5)+'px">'

   ② 企業識別上色：品牌磚用在人脈與尋求頁，標準字用在名片 Logo 槽。
   ③ 頭像只給 Heycard 用戶。非用戶是掃名片來的，名片上沒有臉。

   ═══════════════════════════════════════════ */

/* ═════ ② 企業識別併進公司實體 ═════ */
(function(){
 if(typeof ORGS!=='object'||!ORGS)return;
 Object.keys(BRAND).forEach(function(n){
  if(ORGS[n]){ORGS[n].mark=BRAND[n].m;ORGS[n].logo=BRAND[n].l;ORGS[n].color=BRAND[n].c}})})();

function orgAvatar(name,material,size){
 const s=size||38;
 const B=BRAND[name];
 if(B)return '<div style="width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*0.29)+'px;overflow:hidden;flex:0 0 auto;background:'+B.c+'">'
  +'<img src="'+B.m+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">' +'</div>';
 const M=MAT[material]||MAT.mist;
 return '<div style="width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*0.29)+'px;overflow:hidden;flex:0 0 auto;'
 +'background:'+M.bg+';display:flex;align-items:center;justify-content:center;position:relative">'
 +'<div style="position:absolute;inset:0;mix-blend-mode:overlay;opacity:'+M.gr+';background-image:'+GR+'"></div>'
 +'<span style="position:relative;font-weight:300;font-size:'+Math.round(s*0.42)+'px;color:'+M.ink+'">'+esc((name||'?')[0])+'</span></div>'}

/* ═════ ③ 素材上身：只有用戶有頭像 ═════ */
(function seedFaces(){
 if(S.flag('v19assets'))return;
 const FACE={c1:FACES.f0,c2:FACES.f1,c4:FACES.f3,c5:FACES.f5};
 const cs=S.contacts.map(function(c){
  const o=Object.assign({},c);
  if(o.id==='c4')o.verified=1;                 /* 會發文的一定是用戶 */
  if(o.verified&&FACE[o.id]&&!o.photo)o.photo=FACE[o.id];
  if(!o.verified)delete o.photo;               /* 非用戶不會有臉 */
  if(o.company&&BRAND[o.company]&&!o.logo)o.logo=BRAND[o.company].l;
  return o});
 S.contacts=cs;
 const cards=S.cards.map(function(x){
  const o=Object.assign({},x);
  if(o.company&&BRAND[o.company]&&!o.logo)o.logo=BRAND[o.company].l;
  return o});
 S.cards=cards;
 S.flag('v19assets',true)})();

/* ═════ ① 今天：搬到訊息頁，可收合 ═════ */
/* S.flag 對未設定的鍵回傳 false，所以用「已收起」當旗標，預設展開 */
function sugOpen(){return !S.flag('sugClosed')}
let SUG_ALL=false;

SCREENS.msgs=()=>{
 let th=[];
 try{th=(S.threads||[]).filter(function(t){
  return t&&t.msgs&&t.msgs.length&&S.contact(t.with)})}catch(e){th=[]}

 let sug=[];
 try{
  const withThread={};th.forEach(function(t){withThread[t.with]=1});
  sug=(todayItems2()||[]).filter(function(x){return x.c&&!withThread[x.c.id]})
 }catch(e){sug=[]}
 const open=sugOpen();
 const shown=open?(SUG_ALL?sug.slice(0,20):sug.slice(0,3)):[];

 const threadRow=function(t){
  const c=S.contact(t.with)||{name:'—'};
  const last=t.msgs[t.msgs.length-1]||{t:'',at:''};
  return '<button class="row" data-th="'+esc(t.id)+'" style="width:100%;text-align:left">'
  +faceOf(c,50)
  +'<div class="rt"><div style="display:flex;align-items:baseline;gap:8px">'
  +'<span class="n" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.name)+'</span>'
  +'<span style="font-family:var(--fe);font-size:11px;color:var(--ink3);flex:0 0 auto">'+esc(last.at||'')+'</span></div>'
  +'<div class="s" style="font-size:12.5px;'+(t.unread?'color:var(--ink);font-weight:400':'')+'">'+esc(last.t||'')+'</div></div>'
  +(t.unread?'<i style="width:8px;height:8px;border-radius:99px;background:var(--mang);flex:0 0 auto"></i>'
    :'<i style="width:8px;flex:0 0 auto"></i>')+'</button>'};

 const sugRow=function(x){
  const c=x.c;
  const act=(x.k==='note')
   ?'<button class="btn tt sm" data-today="note" data-id="'+esc(c.id)+'" style="flex:0 0 auto;padding:0 14px">記一筆</button>'
   :'<button class="btn sm" data-draft="'+esc(x.k)+':'+esc(c.id)+'" style="flex:0 0 auto;padding:0 14px">開場</button>';
  return '<div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair)">'
  +'<button data-c="'+esc(c.id)+'" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left">'
  +faceOf(c,44)
  +'<div style="flex:1;min-width:0">'
  +'<div style="display:flex;align-items:baseline;gap:7px">'
  +'<span style="font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap">'+esc(c.name)+'</span>'
  +'<span style="font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.t)+'</span></div>'
  +'<div style="font-size:12.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.s)+'</div>'
  +'</div></button>'+act+'</div>'};

 return screen(bigHead('訊息',null,'<button class="ib" data-act="newMsg">'+ico('edit',19)+'</button>')
 +'<div class="body pad" style="padding-bottom:24px">'

 /* 該聯絡的人：整段可收合，人脈多的時候不會把對話擠到看不見 */
 +(sug.length
   ?'<button data-act="toggleSug" class="sec" style="width:100%;margin:22px 0 4px;text-align:left">'
    +'<b>該聯絡的人</b><span class="ai" style="flex:0 0 auto">AI</span>'
    +'<span style="order:2;flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)">'
    +sug.length+'<i style="display:flex;transform:rotate('+(open?'-90':'90')+'deg);transition:transform .18s">'
    +ico('arr',15,'var(--ink3)')+'</i></span></button>'
    +shown.map(sugRow).join('')
    +((open&&!SUG_ALL&&sug.length>3)
      ?'<button data-act="sugAll" style="width:100%;padding:13px 0;font-size:12.5px;font-weight:700;color:var(--mang);text-align:center">還有 '+(sug.length-3)+' 位</button>'
      :'')
   :'')

 +(th.length
   ?'<div class="sec" style="margin:'+(sug.length?'30px':'22px')+' 0 2px"><b>對話</b>'
    +'<span style="order:2;flex:0 0 auto;font-size:12.5px;color:var(--ink3)">'+th.length+'</span></div>'
    +th.map(threadRow).join('')
   :'<div class="empty" style="padding:'+(sug.length?'32px':'64px')+' 0 8px">'+ico('msg',40,'#C8C8D0',1.4)
    +'<div class="t">還沒有對話</div><div class="s">上面這幾位，現在正是開口的時候</div></div>')
 +'</div>'+navBar())};

/* 訊息頁用的建議清單：沿用同一套判斷，但不再限制三筆 */
function todayItems2(){
 const cs=S.contacts,out=[];
 cs.forEach(function(c){
  let R=[];try{R=contactReasons(c)||[]}catch(e){R=[]}
  if(!R.length)return;
  const r=R[0];
  out.push({score:r.w||0,k:r.kind,c:c,t:r.t,s:r.why})});
 out.sort(function(a,b){return b.score-a.score});
 return out}

/* 人脈頁：拿掉「今天」，這一頁只做找人 */
function todayHTML(){return ''}

document.addEventListener('click',function(e){
 const a=e.target.closest('[data-act]');
 if(!a)return;
 if(a.dataset.act==='toggleSug'){S.flag('sugClosed',sugOpen());SUG_ALL=false;R.refresh();return}
 if(a.dataset.act==='sugAll'){SUG_ALL=true;R.refresh();return}});

/* ═════ ④ 邀請：講加入之後得到什麼 ═════ */
function staleHTML(c){
 const d=daysSince(c);
 const m=Math.floor(d/30);
