<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFEFF0">
<title>Heycard 網頁版</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* ═══ heycard.app 網頁版（個人）═══
   定位：訊息、看人的資訊、看人脈庫。收名片／NFC／設計卡面留在 App（像 IG 網頁版沒有相機）。 */
:root{--mang:#5C5CFF;--mangD:#4A4AE0;--mangS:#F0F0FF;--ink:#1E1E1E;--ink2:#3A3A3A;--ink3:#565656;
 --bg:#EFEFF0;--card:#FFFFFF;--fill:#F5F5F6;--hair:#EBEBEC;--e6:#E6E6E6;--turq:#00D6B3;--turqD:#00806E;--turqS:#E2F9F4;
 --ft:'Taipei Sans TC','PingFang TC','Noto Sans TC',system-ui,sans-serif;--fe:'Creato Display','Outfit',sans-serif;
 --shc:0 2px 5px rgba(18,18,24,.10),0 18px 36px -14px rgba(18,18,24,.30)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);height:100%;overflow:hidden}
body{font-family:var(--ft);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;text-align:left}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.tip{font-size:12px;color:var(--ink3);line-height:1.65}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;background:var(--fill);color:var(--ink2);border-radius:99px;padding:3px 9px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chip.org{background:var(--mangS);color:var(--mangD)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--mang);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:11px}
.btn:hover{background:var(--mangD)}
.btn.gh{background:#fff;border:1px solid var(--e6);color:var(--ink)}
.btn.gh:hover{background:var(--fill)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.inp{background:var(--fill);border:1px solid transparent;border-radius:11px;padding:10px 13px;font-size:14px;width:100%;outline:none}
.inp:focus{background:#fff;border-color:var(--mang)}
/* ── 骨架 ── */
#shell{display:flex;height:100vh;height:100dvh}
#rail{flex:0 0 244px;background:var(--card);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:flex-end;gap:7px;padding:0 8px 18px}
.brand .lgw{width:96px;color:var(--mang);line-height:0}
#meMini{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;margin-bottom:14px;width:100%}
#meMini:hover{background:var(--fill)}
#meMini .av{width:34px;height:34px;border-radius:11px;overflow:hidden;flex:0 0 auto}
#meMini b{font-size:13.5px;display:block;line-height:1.35}
#meMini span{font-size:11.5px;color:var(--ink3)}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;font-size:14px;color:var(--ink2);margin-bottom:3px}
.nv:hover{background:var(--fill)}
.nv.on{background:var(--mangS);color:var(--mangD);font-weight:700}
.nv .n{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--mang);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
#rfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
.inapp{display:flex;gap:6px;padding:2px 4px 10px}
.inapp div{flex:1;text-align:center;color:var(--ink3)}
.inapp i{display:flex;justify-content:center;margin-bottom:4px}
.inapp span{font-size:10.5px;display:block;line-height:1.3}
#main{flex:1;min-width:0;display:flex;overflow:hidden}
/* ── 兩欄（清單＋內容）── */
.list{flex:0 0 320px;border-right:1px solid var(--hair);background:var(--card);display:flex;flex-direction:column;min-width:0}
.list .lhd{padding:18px 18px 12px;border-bottom:1px solid var(--hair)}
.list .lhd h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.list .scr{flex:1;overflow-y:auto}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.row{display:flex;gap:11px;align-items:center;padding:12px 16px;width:100%;border-bottom:1px solid var(--hair)}
.row:hover{background:var(--fill)}
.row.on{background:var(--mangS)}
.row .av{width:42px;height:42px;border-radius:13px;overflow:hidden;flex:0 0 auto;background:var(--fill)}
.row .rt{flex:1;min-width:0}
.row .n{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11px;color:var(--ink3);flex:0 0 auto;align-self:flex-start;padding-top:2px}
.row .dot{width:8px;height:8px;border-radius:99px;background:var(--mang);flex:0 0 auto}
.srch{position:relative}
.srch .inp{padding-left:36px}
.srch i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.fchips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip{cursor:pointer}
/* ── 訊息 ── */
.thd{display:flex;align-items:center;gap:11px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--hair)}
.thd .av{width:38px;height:38px;border-radius:12px;overflow:hidden;flex:0 0 auto}
.msgs{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:min(560px,72%);padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--mang);color:#fff;border-bottom-right-radius:6px}
.bub.you{align-self:flex-start;background:#fff;border:1px solid var(--hair);border-bottom-left-radius:6px}
.bub .at{display:block;font-size:10.5px;opacity:.6;margin-top:4px}
.daysep{align-self:center;font-size:11.5px;color:var(--ink3);background:rgba(255,255,255,.7);border-radius:99px;padding:3px 12px;margin:6px 0}
.comp{display:flex;gap:10px;align-items:flex-end;padding:14px 20px;background:var(--card);border-top:1px solid var(--hair)}
.comp textarea{flex:1;resize:none;max-height:120px;background:var(--fill);border:1px solid transparent;border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.5;outline:none}
.comp textarea:focus{background:#fff;border-color:var(--mang)}
.comp .send{width:42px;height:42px;border-radius:12px;background:var(--mang);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.comp .send:disabled{background:#D9D9D9}
/* ── 人脈詳情 ── */
.det{flex:1;overflow-y:auto;padding:28px}
.detin{max-width:520px;margin:0 auto}
.dhd{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.dhd .av{width:64px;height:64px;border-radius:19px;overflow:hidden;flex:0 0 auto;background:var(--fill)}
.dhd h2{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.dhd .s{font-size:13.5px;color:var(--ink3);margin-top:2px}
.box{background:var(--card);border:1px solid var(--hair);border-radius:16px;overflow:hidden;margin-bottom:12px}
.kv{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--hair);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{width:62px;flex:0 0 auto;color:var(--ink3);font-size:12.5px}
.kv .v{flex:1;min-width:0;word-break:break-all}
.kv a.v{color:var(--mangD)}
.sec{font-size:12px;font-weight:700;color:var(--ink3);margin:20px 2px 8px}
.acts{display:flex;gap:9px;margin-bottom:18px}
.acts .btn{flex:1}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--ink3)}
.empty .ic{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:#C4C4CC}
/* ── 我的名片 ── */
.mewrap{flex:1;overflow-y:auto;padding:34px 28px}
.mein{max-width:900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:34px;align-items:start}
.qrbox{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px;display:flex;gap:16px;align-items:center}
.lnkrow{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:11px;padding:9px 9px 9px 14px;font-family:var(--fe);font-size:13px;color:var(--ink2)}
.lnkrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appnote{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px 16px;margin-top:12px}
.appnote .ic{width:38px;height:38px;border-radius:12px;background:var(--fill);color:var(--ink3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tick{display:inline-flex;color:var(--mang)}
.bk{display:none}
/* ── 登入閘門（未登入時整頁）── */
body.out #shell{display:none}
#gate{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
body.out #gate{display:flex}
.gcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:28px;box-shadow:0 18px 44px -24px rgba(30,30,30,.25)}
.gcard .lgw{width:104px;color:var(--mang);line-height:0;margin-bottom:18px}
.gcard h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);margin-bottom:5px}
.err{font-size:12px;color:#C8322B;margin-top:8px;display:none}
.err.on{display:block}
.gfoot{text-align:center;margin-top:18px;font-size:12px;color:var(--ink3);line-height:1.8}
.gfoot a{color:var(--mangD);cursor:pointer}
/* ── 公開頁（陌生人看到的） ── */
#pub{display:none;min-height:100vh;background:var(--bg);overflow-y:auto}
body.pub #shell,body.pub #gate{display:none}
body.pub #pub{display:block}
.pbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#1E1E1E;color:#fff;font-size:12.5px}
.pbar b{font-weight:700}
.pwrap{max-width:420px;margin:0 auto;padding:26px 20px 60px}
.pbox{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:22px;margin-top:18px}
/* ── App 同一套名片 ── */
.acard{position:relative;overflow:hidden;flex:0 0 auto;font-family:var(--ft)}
.acard .g,.acard .gr,.acard .ed{position:absolute;inset:0}
.acard .gr{mix-blend-mode:overlay}
.acard .ed{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 0 0 1px rgba(0,0,0,.05)}
.acard .bm{position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.hero2{font-family:var(--ft);font-weight:300;letter-spacing:-.055em;line-height:.94}
.lat{font-family:var(--fe);font-weight:300;text-transform:uppercase}
.ftx{display:flex;justify-content:space-between;font-family:var(--fe);font-weight:400;text-transform:uppercase}
/* ── 手機：底部分頁 ── */
@media(max-width:900px){
 #shell{flex-direction:column}
 #rail{flex:0 0 auto;order:2;flex-direction:row;align-items:center;border-right:0;border-top:1px solid var(--hair);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
 .brand,#meMini,#rfoot{display:none}
 .nv{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;margin:0;flex:1;align-items:center;justify-content:center}
 .nv.on{background:transparent}
 .nv .n{position:absolute;margin:0;transform:translate(14px,-9px);min-width:17px;height:17px;font-size:10.5px}
 .nv span.lb{display:block}
 #main{order:1;flex:1;min-height:0}
 .list{flex:1;border-right:0}
 .list.hide,.pane.hide{display:none}
 .pane{flex:1}
 .bk{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);margin-right:2px}
 .det{padding:20px 16px}
 .mewrap{padding:20px 16px}
 .mein{grid-template-columns:1fr;gap:22px}
 .bub{max-width:82%}
 .msgs{padding:16px}
 .comp{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
}
</style>
<div id="gate"></div>
<div id="pub"></div>
<div id="shell">
 <nav id="rail">
  <div class="brand"><span class="lgw"></span></div>
  <button id="meMini"></button>
  <button class="nv" data-pg="msg"></button>
  <button class="nv" data-pg="ppl"></button>
  <button class="nv" data-pg="me"></button>
  <div id="rfoot"></div>
 </nav>
 <main id="main"></main>
</div>

function qrSVG(seed,sz){
 let h=0;for(const ch of String(seed))h=(h*31+ch.charCodeAt(0))>>>0;

 const rng=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  if((x<5&&y<5)||(x>=N-5&&y<5)||(x<5&&y>=N-5))continue;
  if(rng()>0.52)px+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'"/>'}
 const F=(ox,oy)=>'<rect x="'+(ox*cell)+'" y="'+(oy*cell)+'" width="'+(5*cell)+'" height="'+(5*cell)+'" fill="none" stroke="#1E1E1E" stroke-width="'+cell+'"/>'
  +'<rect x="'+((ox+2)*cell)+'" y="'+((oy+2)*cell)+'" width="'+cell+'" height="'+cell+'"/>';
 return '<svg width="'+(sz||120)+'" height="'+(sz||120)+'" viewBox="0 0 '+(sz||120)+' '+(sz||120)+'" fill="#1E1E1E" style="background:#fff;border-radius:8px">'+px+F(0,0)+F(12,0)+F(0,12)+'</svg>'}

function draw(){
 document.body.className=VIEW==='gate'?'out':VIEW==='pub'?'pub':'';
 if(VIEW==='gate'){$('#gate').innerHTML=pgGate();const e=$('#gem');if(e&&!MOB())e.focus();return}
 if(VIEW==='pub'){$('#pub').innerHTML=pgPub();window.scrollTo(0,0);return}
 rail();
 $m().innerHTML=PG==='msg'?pgMsg():PG==='ppl'?pgPpl():pgMe();
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
 const ta=$('#ta');if(ta&&!MOB())ta.focus()}
function toast(t){let el=$('#toast');
 if(!el){el=document.createElement('div');el.id='toast';
  el.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1E1E1E;color:#fff;font-size:13px;padding:10px 18px;border-radius:99px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s';
  document.body.appendChild(el)}
 el.textContent=t;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0'},1900)}
function copyText(t){try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';
 document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();return 1}catch(e){return 0}}

document.addEventListener('click',e=>{
 if(e.target.closest('#gGo')){const v=($('#gem').value||'').trim(),E=$('#gerr');
  if(v.indexOf('@')<0){E.textContent='請輸入 Email';E.classList.add('on');return}
  VIEW='app';DB.set('view','app');draw();return}
 if(e.target.closest('#gApp')){toast('原型：正式版會導到 App Store／Google Play');return}
 if(e.target.closest('#seePub')){VIEW='pub';draw();return}
 if(e.target.closest('#pBack')){VIEW='app';draw();return}
 if(e.target.closest('#pSave')){toast('原型：訪客留 Email 就能存下這張名片');return}
 if(e.target.closest('#seoSw')){SEO=SEO?0:1;DB.set('seo',SEO);draw();return}
 if(e.target.closest('#lgout')){VIEW='gate';DB.set('view','gate');draw();return}
 const nv=e.target.closest('.nv[data-pg]');
 if(nv){PG=nv.dataset.pg;Q='';if(PG==='msg')TH=null;if(PG==='ppl')SEL=null;draw();return}
 if(e.target.closest('#meMini')){PG='me';draw();return}
 if(e.target.closest('#setg')){toast('設定：正式版在這裡改公開欄位、通知與帳號');return}
 const th=e.target.closest('[data-th]');
 if(th){TH=th.dataset.th;const ts=S.threads;const t=ts.find(x=>x.id===TH);if(t&&t.unread){t.unread=0;S.threads=ts}draw();return}
 const pp=e.target.closest('[data-p]');
 if(pp){SEL=pp.dataset.p;draw();return}
 const op=e.target.closest('[data-open]');
 if(op){PG='ppl';SEL=op.dataset.open;Q='';F='all';draw();return}
 const mg=e.target.closest('[data-msg]');
 if(mg){const id=mg.dataset.msg;const ts=S.threads;let t=ts.find(x=>x.with===id);
  if(!t){t={id:'t'+Date.now(),with:id,unread:0,msgs:[]};ts.push(t);S.threads=ts}
  PG='msg';TH=t.id;Q='';draw();return}
 const pb=e.target.closest('[data-pub]');
 if(pb){const p=S.p(pb.dataset.pub);toast('原型：開 '+(p?p.name:'')+' 的公開頁');return}
 const f=e.target.closest('[data-f]');
 if(f){F=f.dataset.f;SEL=null;draw();return}
 if(e.target.closest('[data-bk]')){if(PG==='msg')TH=null;else SEL=null;draw();return}
 if(e.target.closest('#cpy')){copyText('https://heycard.app/'+ME.handle);toast('連結已複製');return}
 if(e.target.closest('#snd')){send();return}
});
